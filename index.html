<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ecc3c9">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0}body{background:#f7f6ec}</style>
</head>
<body>
<title>Casita Huma</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Casita Huma">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@300;400;500;600&family=Gochi+Hand&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Look: playful pet-sitter poster style. Cream paper, tomato-red condensed caps, big pink and blue arcs,
   folder-tab cards with big numbers, red pill buttons with a dot, a bouncing Duckoo head instead of a ball. */
:root{
  --paper:#f7f6ec; --card:#fcfcfc; --line:#e4b4ba; --ink:#4a2a1a; --ink-soft:#9a5a48;
  --red:#d14735; --red-ink:#cc4130; --cream-on-red:#f7f6ec;
  --rose:#ecc3c9; --rose2:#eccfd4; --blue:#bcdaf7; --blue-ink:#3b5e7e; --lav:#e5e0e5; --ball:#efe84c; --grey:#f2f2f2;
  --pink:#ecc3c9; --pink-ink:#d14735; --butter:#efe84c; --mint:#e5e0e5; --sky:#bcdaf7; --lilac:#f2f2f2; --peach:#eccfd4; --teal:#92c2ec;
  --tape:transparent; --tape2:transparent; --shadow:none; --pattern:none;
  --good:#3f7a4a; --bad:#d9443a; --foil:#e2d6d8;
  --f-display:"Bebas Neue","Oswald","Arial Narrow",Impact,sans-serif;
  --f-mono:"Oswald","Arial Narrow",sans-serif;
  --f-body:"Oswald","Arial Narrow",system-ui,sans-serif;
  --f-hand:"Oswald","Arial Narrow",sans-serif;
  --f-scribble:"Gochi Hand","Oswald",cursive;
}
/* same exact palette in light and dark mode, like the reference site */
:root,:root[data-theme="dark"]{color-scheme:light}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);background-image:var(--pattern);background-size:160px 160px;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--pink-ink);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px}

/* header */
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 4px}
.logo{display:flex;align-items:center;gap:8px;min-width:0}
.logo img{width:46px;height:auto}
.logo h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:1.75rem;line-height:1;letter-spacing:.5px;color:var(--pink-ink);text-shadow:2px 2px 0 var(--card),3px 3px 0 var(--line)}
.logo small{display:block;font-family:var(--f-hand);font-size:1.05rem;color:var(--ink-soft);letter-spacing:.3px}
.lang{display:flex;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px;flex:none}
.lang button{border:0;background:none;padding:4px 10px;border-radius:999px;font-weight:600;font-size:.85rem;color:var(--ink-soft)}
.lang button[aria-pressed="true"]{background:var(--pink);color:var(--ink)}

/* week status note */
.note{position:relative;background:var(--butter);padding:14px 16px 12px;margin:18px 4px 6px;transform:rotate(-1deg);box-shadow:var(--shadow);font-family:var(--f-hand);font-size:1.25rem;line-height:1.25}
.note::before{content:"";position:absolute;top:-10px;left:50%;width:84px;height:22px;margin-left:-42px;background:var(--tape);transform:rotate(3deg)}
.note b{font-family:var(--f-body);font-weight:600;font-size:.95rem;display:block;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-soft)}

h2.sec{font-family:var(--f-display);font-weight:400;font-size:1.5rem;margin:26px 0 10px;text-wrap:balance}
p.lead{margin:-4px 0 14px;color:var(--ink-soft)}

/* game cards */
.games{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px}
.game{position:relative;border:0;text-align:left;background:var(--card);border-radius:6px;padding:14px 12px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-height:178px;transition:transform .15s}
.game:nth-child(odd){transform:rotate(-1.2deg)}
.game:nth-child(even){transform:rotate(1deg)}
.game:active{transform:scale(.97)}
.game::before{content:"";position:absolute;top:-9px;left:18px;width:58px;height:18px;background:var(--tape2);transform:rotate(-6deg)}
.game .pic{height:84px;display:flex;align-items:flex-end;justify-content:center;border-radius:4px;background:var(--tint,var(--sky))}
.game .pic img{height:96px;margin-top:-16px}
.game h3{margin:4px 0 0;font-size:1.02rem;font-weight:600;line-height:1.15}
.game .sub{font-size:.82rem;color:var(--ink-soft);line-height:1.25}
.game .tag{position:absolute;z-index:2;top:8px;right:8px;font-size:.7rem;font-weight:600;letter-spacing:.4px;text-transform:uppercase;background:var(--card);border:1.5px solid var(--line);padding:1px 7px;border-radius:999px}
.game[aria-disabled="true"]{opacity:.55;filter:grayscale(.5)}
.game.wide{grid-column:1/-1;flex-direction:row;align-items:center;min-height:0;transform:rotate(-.5deg)}
.game.wide .pic{width:96px;flex:none}
.sticker{filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 3px 3px rgba(53,30,40,.25))}

/* coupons */
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.9rem}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tickets{display:grid;gap:14px}
.ticket{position:relative;display:grid;grid-template-columns:86px 1fr;background:var(--tint,var(--card));border-radius:10px;box-shadow:var(--shadow);overflow:visible;min-height:104px;
  -webkit-mask:radial-gradient(circle 9px at 86px 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 9px at 86px 100%,#0000 98%,#000) bottom/100% 51% no-repeat;
  mask:radial-gradient(circle 9px at 86px 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 9px at 86px 100%,#0000 98%,#000) bottom/100% 51% no-repeat}
.ticket .stub{display:flex;align-items:center;justify-content:center;border-right:2.5px dashed rgba(53,30,40,.25);padding:6px}
.ticket .stub img{max-height:86px;width:auto}
.ticket .body{padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ticket .what{font-family:var(--f-hand);font-size:1.32rem;line-height:1.12;color:var(--ink);text-wrap:balance}
.ticket.free{--tint:var(--mint)} .ticket.cheap{--tint:var(--sky)} .ticket.special{--tint:var(--butter)} .ticket.hers{--tint:var(--lilac)} .ticket.hersBig{--tint:var(--butter)}
.ticket .row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.chip{font-size:.72rem;font-weight:600;letter-spacing:.5px;text-transform:uppercase;background:rgba(255,255,255,.6);padding:2px 8px;border-radius:999px;color:#351e28}
.ticket .when{font-size:.78rem;color:#6e5560}
.btn{border:0;border-radius:999px;padding:9px 18px;font-weight:600;background:var(--pink);color:#351e28;box-shadow:0 3px 0 rgba(53,30,40,.25)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(53,30,40,.25)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.small{padding:6px 14px;font-size:.88rem}
.btn[disabled]{opacity:.5}
.ticket.used{filter:grayscale(1);opacity:.55}
.ticket.used .stamp{position:absolute;right:14px;top:10px;transform:rotate(-12deg);border:3px solid var(--bad);color:var(--bad);font-family:var(--f-display);padding:0 8px;border-radius:6px;font-size:1.1rem;background:rgba(255,255,255,.5)}
.empty{text-align:center;color:var(--ink-soft);font-family:var(--f-hand);font-size:1.3rem;padding:24px 8px}
.empty img{width:90px;display:block;margin:0 auto 6px}

/* bottom bar */
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:2px solid var(--line);display:flex;justify-content:center;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.bar .in{display:flex;max-width:520px;width:100%}
nav.bar button{flex:1;border:0;background:none;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600;font-size:.78rem;color:var(--ink-soft)}
nav.bar button img{width:34px;height:34px;object-fit:contain;transition:transform .2s}
nav.bar button[aria-current="page"]{color:var(--pink-ink)}
nav.bar button[aria-current="page"] img{transform:translateY(-4px) rotate(-6deg) scale(1.12)}
.badge{background:var(--pink-ink);color:var(--card);font-size:.7rem;border-radius:999px;padding:0 6px;margin-left:4px}

/* sheets / overlays */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(42,28,24,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--paper);background-image:var(--pattern);background-size:160px 160px;width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;
  padding-block:18px calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));animation:up .28s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.panel h3{font-family:var(--f-display);font-weight:400;font-size:1.6rem;margin:0 0 4px;text-wrap:balance}
.panel .x{float:right;border:0;background:var(--card);border-radius:999px;width:36px;height:36px;font-size:1.2rem;box-shadow:var(--shadow)}
.progress{display:flex;gap:6px;margin:8px 0 16px}
.progress i{flex:1;height:8px;border-radius:99px;background:var(--line)}
.progress i.ok{background:var(--good)} .progress i.no{background:var(--bad)} .progress i.now{background:var(--pink)}
.q{font-family:var(--f-hand);font-size:1.6rem;line-height:1.2;margin:6px 0 14px;text-wrap:balance}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;text-align:left;font-weight:500;box-shadow:0 3px 0 var(--line)}
.opt.right{background:var(--mint);border-color:var(--good)} .opt.wrong{background:var(--pink);border-color:var(--bad)}
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font-weight:600;font-size:.9rem}
input[type=text],input[type=date],input[type=password],textarea,select{width:100%;font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
textarea{min-height:110px;resize:vertical;font-family:var(--f-hand);font-size:1.3rem}
.hint{font-size:.84rem;color:var(--ink-soft)}
.result{text-align:center;padding:8px 0}
.result img.big{width:150px;margin:0 auto;display:block}
.result .ticket{text-align:left;margin:16px 0;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4) rotate(-10deg);opacity:0}}
.row-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}

/* scratch */
.scratch{position:relative;width:100%;max-width:330px;aspect-ratio:1;margin:8px auto 12px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);padding:10px;border:3px dashed var(--line)}
.scratch .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;height:100%}
.scratch .cell{background:var(--sky);border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.scratch .cell img{height:88%;width:auto}
.scratch .cell.hit{background:var(--butter);outline:3px solid var(--pink-ink)}
.scratch canvas{position:absolute;inset:10px;width:calc(100% - 20px);height:calc(100% - 20px);border-radius:10px;touch-action:none;cursor:grab}

/* wait & win */
.days{display:grid;gap:12px}
.day{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:var(--card);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
.day img{width:60px}
.day b{display:block}
.day .cd{font-family:var(--f-hand);font-size:1.15rem;color:var(--ink-soft)}
.day.ready{background:var(--butter)}

/* her side / settings */
.card{background:var(--card);border-radius:12px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
.card h4{margin:0 0 8px;font-size:1.05rem}
.list{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.list li{background:var(--paper);border-radius:10px;padding:8px 10px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.list li span{min-width:0;overflow-wrap:anywhere}
.list li button{border:0;background:none;color:var(--bad);font-weight:600;flex:none}
.meter{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0}
.meter i{display:block;height:100%;background:var(--good);border-radius:99px}
details.sec-card{padding:0}
details.sec-card summary{list-style:none;display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:12px 14px;cursor:pointer}
details.sec-card summary::-webkit-details-marker{display:none}
details.sec-card summary img{width:46px}
details.sec-card summary .hint{display:block;line-height:1.25}
details.sec-card[open] summary{border-bottom:2px dashed var(--line)}
details.sec-card form,details.sec-card .list{margin:12px 14px}
details.sec-card .list:empty{display:none}
.count{font-weight:600;font-size:.85rem;background:var(--paper);border-radius:999px;padding:3px 10px;white-space:nowrap}
.count.ok{background:var(--mint);color:#2f3d1f}
.mast{display:inline-block;margin-top:6px;font-size:.75rem;font-weight:600;background:var(--paper);border-radius:999px;padding:1px 8px}
.mast.ok{background:var(--mint);color:#2f3d1f}
.tools{display:flex;align-items:center;gap:8px;flex:none}
.bell{position:relative;border:2px solid var(--line);background:var(--card);border-radius:999px;width:42px;height:42px;padding:0;display:flex;align-items:center;justify-content:center}
.bell img{width:30px;height:30px;object-fit:contain}
.bell .badge{position:absolute;top:-6px;right:-6px;margin:0}
.feed{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:8px}
.feed li{background:var(--card);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
.feed li.new{background:var(--butter)}
.feed small{display:block;color:var(--ink-soft)}
.phrases{display:grid;gap:12px}
.phrase{background:var(--card);border-radius:4px;padding:14px 16px;box-shadow:var(--shadow);font-family:var(--f-hand);font-size:1.3rem;line-height:1.2;position:relative}
.phrase:nth-child(3n+1){background:var(--mint);transform:rotate(-.6deg)} .phrase:nth-child(3n+2){background:var(--sky);transform:rotate(.5deg)} .phrase:nth-child(3n){background:var(--pink);transform:rotate(-.3deg)}
.phrase{color:#351e28}
.phrase small{display:block;font-family:var(--f-body);font-size:.8rem;color:#6e5560;margin-top:4px}
h4.grp{font-family:var(--f-display);font-weight:400;font-size:1.25rem;margin:22px 0 10px}
.ex{display:grid;gap:10px;margin-top:10px}
.ex .item{background:var(--paper);border-radius:10px;padding:10px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chips button{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 10px;font-size:.82rem;text-align:left}
.thgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-bottom:6px}
.thgrid button{border:2px solid transparent;background:var(--c);color:#351e28;border-radius:14px;padding:8px 6px;font-weight:600;font-size:.84rem;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.15;opacity:.75}
.thgrid button:last-child:nth-child(3n+1){grid-column:1/-1;flex-direction:row;justify-content:center;gap:8px}
.thgrid button img{width:34px;height:34px;object-fit:contain}
.thgrid button[aria-pressed="true"]{opacity:1;border-color:#351e28;transform:rotate(-1.5deg);box-shadow:var(--shadow)}
.thtitle{display:inline-block;font-family:var(--f-display);font-weight:400;font-size:1.5rem;background:var(--c);color:#351e28;padding:4px 14px;border-radius:6px;transform:rotate(-1deg);margin:16px 0 10px;box-shadow:var(--shadow)}
h4.grp.label{display:inline-block;background:var(--c);color:#351e28;padding:3px 12px;border-radius:6px;transform:rotate(-.8deg)}
.phrase{background:var(--card)!important;border-left:8px solid var(--c);transform:none!important;color:var(--ink)!important}
.phrase small{color:var(--ink-soft)!important}
.jar{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center}
.jar img{width:54px}
.jar .btn{grid-column:1/-1;justify-self:start}
.upl{display:inline-block;cursor:pointer;margin-bottom:6px}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:16px 12px;margin-top:16px}
.polaroid{border:0;background:#fffefa;padding:6px 6px 8px;box-shadow:var(--shadow);transform:rotate(var(--r));display:flex;flex-direction:column;gap:6px;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.polaroid:active{transform:rotate(0) scale(.94)}
.polaroid img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--sky)}
.polaroid span{font-family:var(--f-hand);font-size:1rem;color:#351e28;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.photo-full{background:#fffefa;padding:10px 10px 14px;box-shadow:var(--shadow);transform:rotate(-1deg);margin:4px 0 12px}
.photo-full img{width:100%;max-height:60vh;object-fit:contain;display:block}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 0;font-size:.85rem;color:var(--ink-soft)}
.who button{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:3px 12px;font-weight:600;font-size:.85rem}
.who button[aria-pressed="true"]{background:var(--sky);border-color:var(--sky);color:#351e28}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:14px;max-width:min(92vw,420px);font-size:.92rem;box-shadow:var(--shadow);animation:up .25s}
.rec{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;background:var(--bad);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
audio{width:100%;margin-top:8px}
/* splash */
#splash{position:fixed;inset:0;z-index:100;background:var(--butter);background-image:var(--pattern);background-size:160px 160px;display:flex;align-items:center;justify-content:center;transition:transform .6s cubic-bezier(.7,0,.3,1),opacity .6s}
#splash.out{transform:translateY(-100%);opacity:.6;pointer-events:none}
.sp-inner{display:flex;flex-direction:column;align-items:center}
.sp-duck{width:150px;animation:drop .9s cubic-bezier(.3,1.5,.5,1) both, waddle .5s ease-in-out .95s 3 alternate}
.sp-shadow{width:110px;height:14px;border-radius:50%;background:rgba(53,30,40,.18);margin-top:-6px;animation:shadow .9s cubic-bezier(.3,1.5,.5,1) both}
.bubble{position:relative;background:var(--pink);color:#351e28;font-family:var(--f-display);font-size:2.4rem;padding:8px 22px;border-radius:24px;margin-bottom:16px;box-shadow:0 4px 0 rgba(53,30,40,.25);animation:popin .5s cubic-bezier(.3,1.7,.5,1) .7s both;white-space:nowrap}
.bubble::after{content:"";position:absolute;left:50%;bottom:-12px;margin-left:-10px;border:12px solid transparent;border-top-color:var(--pink);border-bottom:0}
.bubble span{display:inline-block;animation:wave 1s ease-in-out both}
.sp-sub{font-family:var(--f-hand);font-size:1.4rem;color:#351e28;margin-top:10px;animation:fadeup .5s ease-out 1.3s both}
@keyframes drop{0%{transform:translateY(-120vh) rotate(-20deg)}70%{transform:translateY(0) scale(1.08,.9)}100%{transform:translateY(0)}}
@keyframes shadow{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes waddle{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
@keyframes popin{from{transform:scale(0) rotate(-8deg);opacity:0}}
@keyframes wave{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}}
/* button feedback */
.btn,.opt,.tabs button,.lang button,.who button,.chips button,.thgrid button,nav.bar button,.bell,.x{transition:transform .22s cubic-bezier(.3,1.6,.5,1),background-color .2s,box-shadow .2s}
.btn:active,.opt:active,.tabs button:active,.lang button:active,.who button:active,.chips button:active,.bell:active,.x:active{transform:scale(.9)}
.thgrid button:active{transform:scale(.92) rotate(-2deg)}
nav.bar button:active img{transform:scale(.8)}
nav.bar button[aria-current="page"] img{animation:hop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes hop{0%{transform:translateY(0) scale(.8)}60%{transform:translateY(-8px) rotate(-8deg) scale(1.18)}100%{transform:translateY(-4px) rotate(-6deg) scale(1.12)}}
.game{transition:transform .25s cubic-bezier(.3,1.6,.5,1),box-shadow .2s}
.game:active{transform:scale(.95) rotate(0)!important}
.game:active .pic img{transform:translateY(-6px) rotate(-6deg)}
.game .pic img{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.view-in{animation:fadeup .3s ease-out both}
.burst{position:fixed;z-index:200;pointer-events:none;width:10px;height:10px;border-radius:50%;animation:burst .6s ease-out forwards}
.burst.h{border-radius:0;background:none!important;width:auto;height:auto;font-size:14px;line-height:1}
@keyframes burst{from{transform:translate(-50%,-50%) scale(1);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.3);opacity:0}}

/* ===== poster layer ===== */
body{background:var(--paper);font-family:var(--f-body);font-weight:400;letter-spacing:.01em;overflow-x:hidden}
.wrap{padding-block:0 140px}
::selection{background:var(--ball);color:#4a2a1a}

/* top bar: language left, little duck logo centre, bell right */
header.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding-block:calc(10px + env(safe-area-inset-top,0px)) 6px}
header.top .lang{order:1;justify-self:start}
header.top .logo{order:2;justify-self:center;flex-direction:column;gap:0;text-align:center}
header.top .tools{order:3;justify-self:end}
.logo img{width:40px;height:auto;filter:none}
.logo h1{font-family:var(--f-display);font-weight:400;font-size:1.05rem;letter-spacing:.06em;color:var(--red);text-shadow:none;margin:0;line-height:1;white-space:nowrap}
.logo small{display:none}
.lang{background:none;border:0;padding:0;gap:2px}
.lang button{font-family:var(--f-body);font-weight:500;font-size:.9rem;letter-spacing:.06em;color:var(--red);opacity:.45;padding:4px 6px;border-radius:0}
.lang button[aria-pressed="true"]{background:none;color:var(--red);opacity:1;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px}
.bell{border:0;background:none;width:auto;height:auto;gap:4px;font-family:var(--f-body);font-weight:500;letter-spacing:.06em;color:var(--red)}
.bell img{width:30px;height:30px}
.bell .badge{top:-2px;right:-4px}
.badge{background:var(--red);color:var(--cream-on-red);font-family:var(--f-body);font-weight:500}

.who{justify-content:center;font-family:var(--f-body);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--red);gap:6px;margin:2px 0 0;flex-wrap:nowrap}
.who button{border:1.5px solid var(--red);background:none;color:var(--red);font-family:var(--f-body);font-weight:500;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;padding:2px 10px}
.who button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:var(--cream-on-red)}

/* the big arcs behind every screen */
main#view{position:relative;isolation:isolate;min-height:calc(100vh - 230px)}
main#view::before,main#view::after{content:"";position:absolute;z-index:-1;left:-50vw;right:-50vw;margin-inline:auto;width:min(200vw,1200px)}
main#view::before{top:150px;bottom:-140px;background:var(--rose);border-radius:50% 50% 0 0/150px 150px 0 0}
main#view::after{bottom:-140px;height:240px;background:var(--blue);border-radius:50% 50% 0 0/120px 120px 0 0}
.wrap{overflow:clip}

/* the hero line at the top of each screen */
.note{background:none;box-shadow:none;transform:none;border-radius:0;margin:22px 0 0;padding:0 8px;text-align:center;font-family:var(--f-body);font-weight:500;font-size:.88rem;line-height:1.35;letter-spacing:.06em;text-transform:uppercase;color:var(--red)}
.note::before{display:none}
.note b{display:block;font-family:var(--f-body);font-weight:400;font-size:.68rem;letter-spacing:.14em;color:var(--red);opacity:.75;margin-bottom:4px}

/* huge condensed red titles */
h2.sec{position:relative;font-family:var(--f-display);font-weight:400;font-size:clamp(4rem,20vw,5.6rem);line-height:.86;letter-spacing:.005em;text-transform:uppercase;text-align:center;color:var(--red);margin:26px 0 2px;transform:none;text-wrap:balance}
h2.sec::after{content:"↓";display:block;font-family:var(--f-body);font-weight:300;font-size:1.3rem;line-height:1;margin-top:10px}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-16px) rotate(10deg)}}
p.lead,.panel > p.hint,#view > p.hint{display:block;text-align:center;font-family:var(--f-body);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--red);opacity:.85;margin:0 0 16px}
p.lead{display:none}

/* game cards: folder tab, big title, big number, illustration panel */
.games{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-16px;padding:22px 16px 10px;scrollbar-width:none;counter-reset:g}
.games::-webkit-scrollbar{display:none}
.game,.game.wide,.game:nth-child(odd),.game:nth-child(even){flex:0 0 78%;scroll-snap-align:center;transform:none;flex-direction:column;align-items:stretch;text-align:center;min-height:0;
  background:var(--tint,var(--card));border:1.5px solid var(--line);border-radius:4px;box-shadow:none;padding:16px 12px 12px;gap:10px;counter-increment:g}
.games .game:only-child{flex-basis:100%}
.game::before{display:block!important;content:"JUEGO";position:absolute;top:-17px;left:50%;transform:translateX(-50%);width:auto;height:auto;background:var(--tint,var(--card));border:1.5px solid var(--line);border-bottom:0;border-radius:4px 4px 0 0;padding:2px 12px 1px;font-family:var(--f-body);font-size:.6rem;letter-spacing:.14em;color:var(--ink)}
:lang(en) .game::before{content:"GAME"}
.game > div:last-child{order:1;flex:1}
.game .pic,.game.wide .pic{order:2;width:auto;height:150px;border-radius:0;background:var(--card);align-items:center}
.game .pic img{height:130px;margin:0}
.game h3{font-family:var(--f-display);font-weight:400;font-size:2.5rem;line-height:.88;letter-spacing:.01em;text-transform:uppercase;color:var(--ink);margin:0;text-wrap:balance}
.game h3::after{content:counter(g,decimal-leading-zero) ".";display:block;font-size:3.6rem;line-height:1;margin-top:6px}
.game .sub{display:block;font-family:var(--f-body);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);opacity:.8;margin:0 auto;max-width:28ch}
.game .tag{top:10px;right:10px;background:var(--red);border:0;color:var(--cream-on-red);font-family:var(--f-body);font-weight:500;letter-spacing:.08em;border-radius:999px;padding:2px 9px}
.game[aria-disabled="true"]{opacity:.6;filter:grayscale(.4)}
.mast{font-family:var(--f-body);font-weight:500;letter-spacing:.08em;text-transform:uppercase;background:none;border:1.5px solid var(--red);color:var(--red);margin-top:8px}
.mast.ok{background:var(--red);color:var(--cream-on-red);border-color:var(--red)}
.sticker{filter:none}

/* buttons: red pill with a little dot */
.btn{background:var(--red);color:var(--cream-on-red);border:0;border-radius:999px;box-shadow:none;padding:10px 20px;font-family:var(--f-body);font-weight:500;font-size:.95rem;letter-spacing:.08em;text-transform:uppercase}
.btn::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-left:9px;vertical-align:middle;transform:translateY(-1px)}
.btn.ghost{background:none;color:var(--red);border:1.5px solid var(--red)}
.btn.small{padding:7px 15px;font-size:.82rem}
.btn:active{transform:scale(.92)}
.tabs{justify-content:center}
.tabs button{border:1.5px solid var(--red);background:none;color:var(--red);font-family:var(--f-body);font-weight:500;letter-spacing:.08em;text-transform:uppercase}
.tabs button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:var(--cream-on-red)}
.chips button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-family:var(--f-body)}

/* coupons */
.ticket{box-shadow:none}
.ticket.free{--tint:var(--rose2)} .ticket.cheap{--tint:var(--blue)} .ticket.special{--tint:var(--ball)} .ticket.hers{--tint:var(--lav)} .ticket.hersBig{--tint:var(--ball)}
.ticket .stub{border-right:2px dashed rgba(91,44,28,.3)}
.ticket .what{font-family:var(--f-display);font-weight:400;font-size:1.7rem;line-height:.95;letter-spacing:.01em;text-transform:uppercase;color:#4a2a1a}
.ticket .when{color:#8a5442;font-family:var(--f-body);letter-spacing:.04em}
.chip{font-family:var(--f-body);font-weight:500;letter-spacing:.1em;color:#4a2a1a;background:rgba(255,255,255,.55)}
.ticket.used .stamp{font-family:var(--f-display);letter-spacing:.06em;border-width:2px}
.empty{font-family:var(--f-body);text-transform:uppercase;letter-spacing:.06em;font-size:1rem;color:var(--red)}

/* cards, sections, lists */
.card{background:var(--card);border:1.5px solid var(--line);border-radius:4px;box-shadow:none}
.card h4{font-family:var(--f-display);font-weight:400;font-size:1.9rem;line-height:.95;letter-spacing:.01em;text-transform:uppercase;color:var(--ink)}
details.sec-card summary b{font-family:var(--f-display);font-weight:400;font-size:1.7rem;line-height:.95;letter-spacing:.01em;text-transform:uppercase;color:var(--ink)}
details.sec-card summary .hint{display:none}
details.sec-card[open] summary{border-bottom:1.5px dashed var(--line)}
.count{background:none;border:1.5px solid var(--red);color:var(--red);font-family:var(--f-body);font-weight:500;letter-spacing:.06em}
.count.ok{background:var(--red);color:var(--cream-on-red);border-color:var(--red)}
.list li{background:var(--paper);border-radius:2px}
.list li button{color:var(--red)}
.meter{background:var(--rose2);height:10px}
.meter i{background:var(--red)}
.hint{color:var(--ink-soft);font-family:var(--f-body)}
.field label{font-family:var(--f-body);font-weight:500;letter-spacing:.08em;text-transform:uppercase;font-size:.78rem;color:var(--red)}
input[type=text],input[type=date],input[type=password],textarea,select{border:1.5px solid var(--line);border-radius:4px;background:var(--card);font-family:var(--f-body);font-weight:400}
textarea{font-family:var(--f-body);font-size:1.05rem}
.day{background:var(--card);border:1.5px solid var(--line);border-radius:4px;box-shadow:none}
.day b{font-family:var(--f-display);font-weight:400;font-size:1.6rem;line-height:.95;letter-spacing:.01em;text-transform:uppercase;color:var(--ink)}
.day .cd{font-family:var(--f-body);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--red)}
.day.ready{background:var(--ball)}
.feed li{background:var(--card);border:1.5px solid var(--line);border-radius:4px;box-shadow:none}
.feed li.new{background:var(--ball);color:#4a2a1a}

/* therapy */
.thgrid button{font-family:var(--f-body);font-weight:500;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);border-radius:4px;border:1.5px solid transparent;transform:none}
.thgrid button[aria-pressed="true"]{border-color:var(--red);box-shadow:none;transform:none;opacity:1}
.thtitle{font-family:var(--f-display);font-weight:400;font-size:2.2rem;line-height:.95;letter-spacing:.01em;text-transform:uppercase;color:var(--ink);background:var(--c);border-radius:4px;transform:none;box-shadow:none}
h4.grp{font-family:var(--f-display);font-weight:400;font-size:1.7rem;letter-spacing:.01em;text-transform:uppercase;color:var(--red)}
h4.grp.label{color:var(--ink);transform:none}
.phrase{font-family:var(--f-body);font-weight:400;font-size:1.05rem;line-height:1.3;border-radius:4px;box-shadow:none}
.phrase small{font-family:var(--f-body);letter-spacing:.04em}
.ex .item{background:var(--paper);border-radius:4px}

.thgrid button,.thtitle,h4.grp.label{color:var(--cream-on-red)}
h4.grp.label{background:var(--red)!important;opacity:1!important}
.phrase{border-left-color:var(--red)!important}
.thgrid button{opacity:.8}
.thgrid button[aria-pressed="true"]{opacity:1;border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--cream-on-red)}
.thgrid button img{filter:drop-shadow(0 0 1px #fff) drop-shadow(0 0 1px #fff)}

.streak{text-align:center;background:var(--card);margin-top:14px;position:relative}
.streak{padding:12px 14px;margin:18px 0 0;cursor:pointer}
.sthead{display:flex;justify-content:space-between;align-items:baseline}
.sthead b{font-family:var(--f-display);font-weight:400;font-size:1.4rem;letter-spacing:.02em;text-transform:uppercase;color:var(--red)}
.streak .stn{font-family:var(--f-body);font-weight:500;font-size:.85rem;letter-spacing:.06em;color:var(--ink)}
.stdots{display:flex;justify-content:center;align-items:center;margin:8px 0 6px;position:relative}
.stdots::before{content:"";position:absolute;left:8%;right:8%;top:50%;height:1.5px;background:var(--red)}
.stdots i{position:relative;flex:1;display:flex;justify-content:center}
.stdots i::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--paper);border:1.5px solid var(--red)}
.stdots i.on::after{background:var(--red)}
.streak p{margin:0 auto 6px;max-width:30ch;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.streak small{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--red)}

.tools{gap:4px}
.gear{border:0;background:none;font-size:1.45rem;line-height:1;padding:4px;width:auto;height:auto}

.daily{position:relative;background:var(--ball);border-radius:4px;padding:18px 16px 12px;margin:30px 0 0;text-align:center;color:#4a2a1a}
.daily .dtab{position:absolute;top:-17px;left:50%;transform:translateX(-50%);background:var(--ball);border-radius:4px 4px 0 0;padding:2px 12px 1px;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.daily p{margin:0 0 6px;font-family:var(--f-display);font-size:1.6rem;line-height:1;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.daily small{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--red)}

.scratch{--sz:min(320px,calc(100vw - 64px));width:var(--sz);height:var(--sz);aspect-ratio:auto;padding:0}
.scratch .grid{position:absolute;inset:10px;height:auto;grid-template-rows:repeat(3,minmax(0,1fr));grid-template-columns:repeat(3,minmax(0,1fr));overflow:hidden}
.scratch .cell{min-height:0;min-width:0}
.scratch .cell img{height:88%;width:88%;object-fit:contain}
.scratch canvas{inset:10px;width:calc(100% - 20px);height:calc(100% - 20px)}

.logo img.us{height:58px;width:auto;display:block;animation:hop2 2.4s ease-in-out infinite;transform-origin:bottom center}
@keyframes hop2{0%,80%,100%{transform:translateY(0)}88%{transform:translateY(-4px) rotate(-3deg)}}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.lhint{text-align:center;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;color:var(--red);margin:-6px 0 12px}

/* album */
.polaroid,.photo-full{background:#fffdf8;box-shadow:none;border:1.5px solid var(--line)}
.polaroid span{font-family:var(--f-scribble);font-size:1.1rem;color:#4a2a1a}

/* sheets */
.sheet{background:rgba(91,44,28,.35)}
.sheet .panel{background:var(--paper);border-radius:50% 50% 0 0/46px 46px 0 0;padding-top:30px}
.panel h3,.result h3{font-family:var(--f-display);font-weight:400;font-size:clamp(2.8rem,13vw,3.6rem);line-height:.88;letter-spacing:.01em;text-transform:uppercase;text-align:center;color:var(--red);transform:none;margin:8px 0 8px}
.panel .x{background:none;box-shadow:none;border:1.5px solid var(--red);color:var(--red);font-family:var(--f-body)}
.q{font-family:var(--f-display);font-weight:400;font-size:2.2rem;line-height:.95;letter-spacing:.01em;text-transform:uppercase;text-align:center;color:var(--ink)}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:999px;box-shadow:none;padding:12px 18px;text-align:center;font-family:var(--f-body);font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--ink)}
.opt.right{background:var(--blue);border-color:var(--blue-ink)} .opt.wrong{background:var(--rose);border-color:var(--red)}
.progress i{height:6px;background:var(--rose2)}
.progress i.now{background:var(--ball)} .progress i.ok{background:var(--blue-ink)} .progress i.no{background:var(--red)}
.scratch{border:1.5px solid var(--line);box-shadow:none;border-radius:4px}
.scratch .cell{background:var(--blue);border-radius:2px}
.scratch .cell.hit{background:var(--ball);outline-color:var(--red)}
.toast{background:var(--red);color:var(--cream-on-red);font-family:var(--f-body);letter-spacing:.04em;border-radius:999px;box-shadow:none}

/* bottom bar: cream, thin red line with timeline dots */
nav.bar{background:var(--paper);border-top:1.5px solid var(--red)}
nav.bar button{position:relative;color:var(--red);opacity:.6;font-family:var(--f-body);font-weight:500;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;padding:12px 2px 10px}
nav.bar button::before{content:"";position:absolute;top:-5px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--red)}
nav.bar button[aria-current="page"]{opacity:1;color:var(--red)}
nav.bar button[aria-current="page"]::before{width:14px;height:14px;top:-8px;margin-left:-7px;background:var(--paper);border:1.5px solid var(--red);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 8px var(--red)}
nav.bar button img{width:28px;height:28px}
nav.bar button span{font-size:inherit}

/* splash: pink LOADING screen */
#splash{background:var(--rose);flex-direction:column}
#splash.out{transform:translateY(-100%);opacity:1}
.sp-inner{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%}
.sp-title{font-family:var(--f-display);font-weight:400;font-size:clamp(3.6rem,17vw,6rem);line-height:.9;letter-spacing:.01em;color:var(--red);text-align:center;text-transform:uppercase;margin-top:14px;transform:none}
.sp-title div:last-child{color:var(--red)}
.sp-title.name span{display:inline-block;animation:rise .45s cubic-bezier(.3,1.5,.5,1) both}
@keyframes rise{from{transform:translateY(40px);opacity:0}}
.sp-sub{position:absolute;left:16px;right:16px;bottom:calc(28px + env(safe-area-inset-bottom,0px));text-align:center;font-family:var(--f-body);font-weight:500;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--red);margin:0;animation:none}

.sp-inner{position:relative;z-index:2;pointer-events:none}
.sp-title{background:var(--paper);padding:10px 18px 4px;border-radius:6px;transform:rotate(-3deg)!important;box-shadow:0 8px 20px rgba(74,42,26,.18)}
.sp-sub{background:var(--paper);border-radius:999px;padding:8px 14px;left:24px;right:24px}
#splash{overflow:hidden}
.sp-pic{position:absolute;z-index:1;max-width:220px;height:auto;transform:rotate(var(--r));filter:drop-shadow(0 6px 10px rgba(74,42,26,.18));animation:picpop .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes picpop{from{transform:rotate(calc(var(--r) - 25deg)) scale(0);opacity:0}}
.sp-sub{z-index:2}

/* button feedback */
.game{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.game:active{transform:scale(.96)!important}
.view-in{animation:fadeup .3s ease-out both}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}}


/* ===== fun pack: big status circles, coins, monas album, packs, letter, secrets, confetti ===== */
.tries-box{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:6px 10px;align-items:start;background:#fcfcfc;border:1.5px solid var(--line);border-radius:18px;padding:14px 12px 12px;margin:4px 0 6px}
.tb-col{display:flex;flex-direction:column;align-items:center;gap:6px}
.tb-col small{font-family:var(--f-body);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.tb-dots{display:flex;gap:8px}
.tdot{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;border:2px dashed var(--line);background:var(--paper);color:var(--cream-on-red);font-size:1.4rem;font-family:var(--f-display);padding:0}
.tdot.on{background:var(--red);border:2px solid var(--red);animation:popin .45s cubic-bezier(.3,1.6,.5,1) both}
.tdot.coin{background:var(--ball);border:2px solid #d6cf2e;color:#4a2a1a;font-size:1.9rem;cursor:pointer;box-shadow:inset 0 -4px 0 rgba(74,42,26,.12)}
.tdot.cup{background:var(--blue);border:2px solid #92c2ec;color:#4a2a1a;font-size:1.9rem;cursor:pointer;box-shadow:inset 0 -4px 0 rgba(74,42,26,.1)}
.tb-foot{grid-column:1/-1;text-align:center;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--red);line-height:1.6;border-top:1.5px dashed var(--line);padding-top:8px;margin-top:4px}

.stk img.fr-cut{left:0;top:auto;bottom:0;width:100%;height:92%;object-fit:contain;object-position:bottom;border:none;background:none}

.stk-card{display:block;width:100%;text-align:center;background:var(--card);margin:12px 0 0;padding:12px 14px;border:1.5px solid var(--line);border-radius:6px;cursor:pointer;font:inherit;color:inherit}

.stk-card small{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--red)}
.pack{display:block;margin:10px auto 6px;width:200px;height:260px;border-radius:8px;background:var(--red);color:var(--cream-on-red);position:relative;overflow:hidden;cursor:pointer;animation:wob 1.4s ease-in-out infinite;border:none;padding:0}

.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:340px;margin:10px auto 26px}
.pick{position:relative;aspect-ratio:3/4;perspective:800px;background:none;border:none;padding:0;cursor:pointer;animation:popin .4s cubic-bezier(.3,1.6,.5,1) both}
.pick:nth-child(2){animation-delay:.12s} .pick:nth-child(3){animation-delay:.24s}

.pick .back,.pick .front{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .55s}

.pick .lab{position:absolute;left:0;right:0;bottom:-22px;text-align:center;font-style:normal;font-family:var(--f-display);font-size:1.2rem;color:var(--red)}

.stk-big{perspective:900px;display:grid;place-items:center;margin:6px 0 10px}
.flipper{position:relative;width:min(240px,62vw);aspect-ratio:3/4;cursor:pointer;transition:transform .6s;transform-style:preserve-3d}

.letter{display:block;width:100%;position:relative;background:#fcfcfc;border:1.5px solid var(--line);border-radius:6px;padding:16px 16px 14px 70px;text-align:left;margin:0 0 14px;cursor:pointer;font:inherit;color:inherit}

.letter-paper p{margin:0 0 10px} .letter-paper .blur{filter:blur(5px);user-select:none}

.stories{display:grid;gap:10px} .story{display:flex;gap:10px;align-items:center} .story .mini{width:54px;flex:none} .story-f{flex:1;display:grid;gap:4px}

.mk-row{display:flex;gap:14px;align-items:flex-start;margin-top:12px} .mk-prev{width:130px;flex:none} .mk-opts{flex:1;min-width:0}

/* ===== cards with characters (Dumb Ways style composition) ===== */
:root{--f-round:"Nunito",ui-rounded,system-ui,sans-serif}
.games{padding:78px 16px 14px;gap:16px}
.game,.game.wide,.game:nth-child(odd),.game:nth-child(even){padding:62px 16px 16px;gap:0;border:none;border-radius:26px;overflow:visible}
.game::before{display:none!important}
.game .pic,.game.wide .pic{position:absolute;order:0;left:50%;top:-70px;transform:translateX(-50%);width:auto;height:126px;background:none!important;border:none;pointer-events:none}
.game .pic img{height:126px;margin:0;filter:drop-shadow(0 4px 0 rgba(74,42,26,.12))}
.game:active .pic img{transform:translateY(-8px) rotate(-6deg)}
.game .gbody{display:flex;flex-direction:column;align-items:center;gap:6px}
.game h3{font-size:2.3rem}
.game h3::after{content:none}
.gnum{position:absolute;top:14px;left:16px;font-family:var(--f-display);font-size:1.25rem;color:var(--ink);opacity:.55}
.game .sub{font-family:var(--f-round);font-weight:800;font-size:1rem;letter-spacing:0;text-transform:none;opacity:1;max-width:none;color:var(--ink)}
.game .meta{font-family:var(--f-round);font-weight:500;font-size:.85rem;color:var(--ink);opacity:.75}
.game .play{display:inline-flex;align-items:center;gap:8px;margin:10px 0 2px;background:var(--red);color:var(--cream-on-red);border-radius:999px;padding:12px 30px;font-family:var(--f-display);font-size:1.5rem;letter-spacing:.06em;box-shadow:0 4px 0 #a8382a;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.game .play b{font-family:var(--f-round);font-weight:800;font-size:1.1rem}
.game:active .play{transform:translateY(3px);box-shadow:0 1px 0 #a8382a}
.game[aria-disabled="true"] .play{background:var(--ink-soft);box-shadow:none}
.gbadge{position:static;align-self:center;margin:0 0 4px;order:0;font-size:.8rem!important;z-index:3;background:var(--ball);color:#4a2a1a;font-family:var(--f-display);font-size:1rem;letter-spacing:.06em;padding:3px 12px;border-radius:999px;transform:rotate(4deg);border:2px solid #fff}
.game .tag{top:14px;right:14px}
.mast{display:flex!important;align-items:center;gap:8px;width:100%;margin-top:12px!important;border:none!important;background:none!important;padding:0!important;color:var(--ink)!important;font-family:var(--f-round)!important;font-weight:700;font-size:.72rem;letter-spacing:0!important;text-transform:none!important}
.mast .ml{white-space:nowrap} .mast .mbar{flex:1;height:8px;border-radius:999px;background:rgba(255,255,255,.7);overflow:hidden} .mast .mbar i{display:block;height:100%;background:var(--red);border-radius:999px}
.mast b{font-weight:800}
.games.solo .game{flex-basis:100%}
h2.sec-tab{display:table;margin:30px auto 0;font-family:var(--f-display);font-weight:400;font-size:1.5rem;letter-spacing:.08em;text-transform:uppercase;color:#4a2a1a;background:var(--blue);padding:4px 18px;border-radius:10px;transform:rotate(-3deg)}
.panel > p.hint,.panel .result > p.hint{font-family:var(--f-round);font-weight:600;font-size:.9rem;letter-spacing:0;text-transform:none}
.loose img,.stk img{-webkit-user-drag:none;user-select:none}
.loose{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.loose img{-webkit-touch-callout:none;pointer-events:none}
.tray-row{flex-wrap:wrap;overflow:visible;justify-content:flex-start}
.loose{width:calc(25% - 8px)!important;animation:none}
.loose.lifting{opacity:.25}
.dghost{position:fixed;left:0;top:0;z-index:9998;pointer-events:none;box-shadow:0 14px 24px rgba(74,42,26,.3);aspect-ratio:3/4}
.stk.target{border-color:var(--red)!important;border-style:dashed;animation:pulse 1s ease-in-out infinite} .stk.own.target{outline:3px dashed var(--red)}
@keyframes pulse{50%{transform:scale(1.05);background:var(--rose2)}}
.stk.hover{transform:scale(1.1)!important;background:var(--ball)!important}
.stk.nope{animation:shake .4s}
.flab{display:block;font-family:var(--f-round);font-weight:700;font-size:.82rem;color:var(--ink);margin:10px 0 4px}
h3.sec-tab{display:table;margin:26px auto 12px;font-family:var(--f-display);font-weight:400;font-size:1.4rem;letter-spacing:.08em;text-transform:uppercase;color:#4a2a1a;background:var(--blue);padding:4px 16px;border-radius:10px;transform:rotate(-3deg)}
.sec-card.static .summary{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center;padding:12px 14px} .sec-card.static img{width:46px}
.sec-card.static b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.7rem;line-height:.95;text-transform:uppercase;color:var(--ink)}
.sec-card.static .hint,details.sec-card[open] summary .hint{display:block;font-family:var(--f-round);font-weight:600;font-size:.8rem;letter-spacing:0;text-transform:none;color:var(--ink);opacity:.75;margin-top:4px}

/* ===== game stage ===== */
.stage{position:relative;margin:26px 0 14px;width:100%;box-sizing:border-box;background:var(--sbg);border-radius:28px;padding:12px 14px 54px;overflow:hidden}
.stage::before{content:"";position:absolute;left:-20%;right:-20%;bottom:-60%;height:95%;border-radius:50%;background:rgba(255,255,255,.4)}
.st-top{position:relative;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.st-top b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;font-family:var(--f-display);font-weight:400;font-size:1.05rem;letter-spacing:.04em;color:#4a2a1a;background:#fff;padding:2px 12px;border-radius:999px;transform:rotate(-2deg)}
.st-dots{display:flex;flex:none;gap:4px;flex-wrap:nowrap;justify-content:flex-end} .st-dots i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--f-round);font-weight:800;font-size:.72rem;background:rgba(255,255,255,.6);color:#4a2a1a}
.st-dots i.now{background:var(--ball);transform:scale(1.15)} .st-dots i.ok{background:#3f7a4a;color:#fff} .st-dots i.no{background:var(--red);color:#fff}
.st-scene{position:relative;display:flex;align-items:flex-end;gap:6px;min-height:150px}
.host{width:92px;flex:none;align-self:flex-end;animation:bob 2.2s ease-in-out infinite;transform-origin:bottom;filter:drop-shadow(0 4px 0 rgba(74,42,26,.12));position:relative;z-index:2}
@keyframes bob{50%{transform:translateY(-6px) rotate(2deg)}}
.host.yay{animation:yay .7s cubic-bezier(.3,1.6,.5,1)} @keyframes yay{30%{transform:translateY(-34px) rotate(-8deg) scale(1.08)}60%{transform:translateY(0) scale(1.05,.92)}}
.host.oops{animation:oops .55s} @keyframes oops{20%{transform:rotate(-10deg)}40%{transform:rotate(9deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
.sbub{position:relative;flex:1;min-width:0;background:#fff;border-radius:22px;padding:14px 14px 12px;margin-bottom:56px;box-shadow:0 4px 0 rgba(74,42,26,.1);animation:popin .4s cubic-bezier(.3,1.6,.5,1) both;z-index:2}
.sbub::after{content:"";position:absolute;left:-10px;bottom:16px;border:11px solid transparent;border-right-color:#fff;border-left:0}
.sbub p{margin:0;white-space:normal;text-wrap:balance;overflow-wrap:break-word;hyphens:auto;font-family:var(--f-display);font-size:1.6rem;line-height:.98;text-transform:uppercase;color:#4a2a1a}
.sbub .react{display:inline-block;white-space:normal;margin-top:8px;font-family:var(--f-round);font-weight:800;font-size:.85rem;padding:3px 10px;border-radius:999px;animation:popin .35s cubic-bezier(.3,1.6,.5,1) both}
.sbub .react.ok{background:#3f7a4a;color:#fff} .sbub .react.no{background:var(--red);color:#fff} .sbub .react.hintr{background:var(--ball);color:#4a2a1a}
.sbub .was{display:block;white-space:normal;margin-top:8px;font-family:var(--f-round);font-weight:600;font-size:.85rem;color:#4a2a1a}
.crowd{position:absolute;left:0;right:0;bottom:-6px;display:flex;justify-content:flex-end;gap:2px;padding-right:10px;z-index:1}
.crowd img{width:58px;animation:peek .5s cubic-bezier(.3,1.6,.5,1) both;animation-delay:var(--d);transform-origin:bottom}

/* nota del día (sent ONLY as a daily iPhone push by the hosted backend, never shown in the app): one happy line a day from the therapy tab (the book, or something the partner wrote) */
function dailyPick(){
  const who=me(), ymdS=ymd(today());
  const book=[]; C.fightRight.forEach(g=>g.items.forEach(i=>book.push({en:i.en, es:i.es, src:"Fight Right"})));
  const mine=[];
  S.jar.filter(j=>j.to===who).forEach(j=>mine.push({en:j.text, es:j.text, src:(L()==="es"?"De ":"From ")+nameOf(j.from)}));
  S.wins.forEach(w=>mine.push({en:w.text, es:w.text, src:t("th_wins")}));

/* racha de pareja: a week counts when BOTH played at least one game; 8 weeks in a row = one coupon each */
const STREAK = 8;
function wkAgo(n){ const d=today(); const day=(d.getDay()+6)%7; return ymd(new Date(d.getFullYear(),d.getMonth(),d.getDate()-day-7*n)); }
function played(o,k){ return !!(o[k] && o[k].used>0); }
function connected(k){ return played(S.weeks,k) && played(S.aWeeks,k); }
function streakInfo(){
  const cur = wkAgo(0), nowOk = connected(cur); let n=0;
  for(let i = nowOk?0:1; i<60; i++){ const k=wkAgo(i); if(S.streakFrom && k<=S.streakFrom) break; if(!connected(k)) break; n++; }
  return {n, nowOk, her:played(S.weeks,cur), andrew:played(S.aWeeks,cur)};
}
function giveStreak(who){
  const keep=S.player; S.player=who;
  if(who==="andrew" && !S.her.coupons.length && !S.her.bigcoupons.length){ S.streakOwed.andrew=(S.streakOwed.andrew||0)+1; S.player=keep; return null; }
  const c=awardRaw(who==="her"?"cheap":"regular","streak"); S.player=keep; return c;
}
function checkStreak(){
  const owed=S.streakOwed.andrew||0;
  if(owed && (S.her.coupons.length||S.her.bigcoupons.length)){ S.streakOwed.andrew=0; for(let i=0;i<owed;i++) giveStreak("andrew"); }
  const st=streakInfo(); if(st.n<STREAK) return;
  S.streakFrom = wkAgo(0); giveStreak("her"); giveStreak("andrew");
  ["her","andrew"].forEach(to=>S.activity.unshift({to, from:to==="her"?"andrew":"her", en:"Couple streak! 8 weeks in a row. You both won a coupon.", es:"¡Racha de pareja! 8 semanas seguidas. Los dos ganaron un cupón.", at:Date.now(), seen:false}));
  save(); setTimeout(()=>toast(t("stWon")),400);
}
function streakHTML(){
  const st=streakInfo(), dots=[...Array(STREAK)].map((_,i)=>`<i class="${i<st.n?"on":""}"></i>`).join("");
  const now = st.nowOk ? t("stNowOk") : st.her||st.andrew ? t("stWait",{n:st.her?"Andrew":"Indiana"}) : t("stNone");
  return `<div class="streak card"><div class="sthead"><b>${t("stTitle")}</b><span class="stn">${st.n}/${STREAK}</span></div><div class="stdots">${dots}</div><small>${now}</small></div>`;
}

const CROWD = ["doorman","lobbyboy","bellboy","richwoman","richman","suitcasekid","farmer","gardener","pig","rabbit","scarecrow","digger","beetroot","orange","potato","sprayer","ricesack","founder","sunbed","donotdisturb"];
function stageHTML(kind, i, total, marks, text, extra=""){

function stageReact(ok, msg){

  h.classList.remove("yay","oops"); void h.offsetWidth; h.classList.add(ok?"yay":"oops"); if(c){ c.classList.remove("cheer","sigh"); void c.offsetWidth; c.classList.add(ok?"cheer":"sigh"); }

/* quiz (trivia + love language) */
function openQuiz(kind){
  const rule = kind==="trivia" ? C.triviaRule : C.loveRule;
  const loveItem = (text, a) => { const others = shuffle(Object.keys(C.loveOptions).filter(k=>k!==a)).slice(0,3);
    if(!C.loveOptions[a]) return {text, options: shuffle([{label:String(a), ok:true}, ...others.map(k=>({label:tx(C.loveOptions[k]), ok:false}))])};
    return {text, options: shuffle([a,...others].map(k=>({label:tx(C.loveOptions[k]), ok:k===a})))}; };
  const ask = isA() ? 5 : rule.ask;
  const pool = shuffle(remaining(kind)).slice(0, ask).map(q=>{
    let item;
    if(kind==="finish"){ const a=q.a, text=isA()?q.s:tx(q); item={text, options:["andrew","her","both"].map(k=>({label:whoLabel(k), ok:k===a}))}; }
    else if(isA()) item = kind==="trivia" ? {text:q.q, options:shuffle([{label:q.a,ok:true},...[q.w1,q.w2,q.w3].map(l=>({label:l,ok:false}))])} : loveItem(q.s, q.a);
    else item = (kind==="trivia" || q.opts) ? {text:tx(q), options:shuffle(q.opts.map((o,k)=>({label:tx(o), ok:k===q.a}))), bonus:q.bonus||0} : loveItem(tx(q), q.a);
    item.key = q.key; return item; });
  const need = !isA() && pool.length>=rule.ask ? rule.need : Math.ceil(pool.length*0.6);
  const marks = []; let i = 0; let started=false;
  const step = () => {
    const q = pool[i], options = q.options;
    openSheet(`${stageHTML(kind, i, pool.length, marks, q.text)}
      <div class="opts2">${options.map((o,k)=>`<button class="opt opt2" type="button" data-k="${k}" style="--d:${.06*k}s"><span class="ol">${"ABCD"[k]||k+1}</span><span class="ot">${esc(o.label)}</span><span class="os"></span></button>`).join("")}</div>`);
    document.querySelectorAll("#panel .opt").forEach(b=>b.onclick=()=>{
      if(!started){ started=true; useTry(kind,false); }
      const o = options[+b.dataset.k]; marks[i]=o.ok; if(o.ok && !M()[kind].includes(q.key)){ M()[kind].push(q.key); save(); if(q.bonus){ for(let n=0;n<q.bonus;n++) award("regular","bonus"); setTimeout(()=>toast(t("bonusWon",{n:q.bonus})),300); } }
      b.classList.add("picked");
      document.querySelectorAll("#panel .opt").forEach((x,k)=>{ x.disabled=true; if(options[k].ok){ x.classList.add("right"); x.querySelector(".os").textContent=t("isRight"); } });
      if(!o.ok){ b.classList.add("wrong"); b.querySelector(".os").textContent=t("yourPick"); }
      stageReact(o.ok, o.ok ? t("yay") : t("oops"));
      setTimeout(()=>{ i++; if(i<pool.length) step(); else finish(); }, 1250);
    });
  };
  const finish = () => {
    const n = marks.filter(Boolean).length, won = n>=need;
    const w=week(); w.log[w.log.length-1].won=won; save();
    showResult(won?kind:false, `<p class="q">${t("score",{n,t:pool.length})}</p>`);
  };
  step();
}

/* ¿Quién es más probable?: both answer the same 5 each period; every 2 matches in a row = a coin each, 5 = a bonus coupon each, the first mismatch ends it */
const MATCH = {ask:5, opts:["andrew","her","both","none"]};
function matchPool(){ return [...C.finish.map(x=>({key:x.en, en:x.en, es:x.es})), ...S.her.finish.map(x=>({key:"h"+x.at, en:x.s, es:x.s}))]; }
function matchRound(){ S.match ||= {}; S.matchUsed ||= []; const k="P"+periodIdx(); let r=S.match[k];
  if(!r){ const pool=matchPool(); if(pool.length<MATCH.ask) return null; const used=new Set(S.matchUsed); let fresh=pool.filter(q=>!used.has(q.key)); if(fresh.length<MATCH.ask){ S.matchUsed=[]; fresh=pool; }
    const qs=shuffle(fresh).slice(0,MATCH.ask).map(q=>q.key); S.matchUsed.push(...qs); r=S.match[k]={qs, her:null, andrew:null, result:null}; save(); }
  return r; }
function matchQ(key){ const q=matchPool().find(x=>x.key===key); return q ? (L()==="es"?q.es:q.en) : key; }
function matchState(){ const r=(S.match||{})["P"+periodIdx()]; if(!r) return "new"; if(r.result) return "done"; if(r[me()]) return "waiting"; if(r[other()]) return "yourTurn"; return "new"; }
function matchCard(left){ const st=matchState(), r=(S.match||{})["P"+periodIdx()];
  if(st==="waiting") return {off:false, tag:t("mtWaitTag",{n:nameOf(other())})};
  if(st==="done") return {off:false, tag:r.result.seen?.[me()] ? t("mtDoneTag") : t("mtResTag")};
  if(st==="yourTurn") return {off:left<=0, tag:left<=0 ? t("locked") : t("mtYourTurn")};
  return {off:left<=0, tag:left<=0 ? t("locked") : ""}; }
function asPlayer(p, fn){ const prev=S.player; S.player=p; try{ return fn(); } finally{ S.player=prev; } }
function openMatch(){
  const r = matchRound(); if(!r) return toast(t("needHer"));
  if(r.result) return matchResult(r, false);
  if(r[me()]) return matchSaved();
  if(triesLeft()<=0) return toast(t("weekNext",{d:nextReset()}));
  const theirs = r[other()] ? r[other()].ans : null, mine=[], marks=[]; let i=0, started=false;
  const step = () => {
    openSheet(`${stageHTML("finish", i, r.qs.length, marks, matchQ(r.qs[i]))}
      <div class="opts2">${MATCH.opts.map((k,n)=>`<button class="opt opt2" type="button" data-w="${k}" style="--d:${.06*n}s"><span class="ol">${"ABCD"[n]}</span><span class="ot">${esc(whoLabel(k))}</span><span class="os"></span></button>`).join("")}</div>`);
    document.querySelectorAll("#panel .opt").forEach(b=>b.onclick=()=>{
      if(!started){ started=true; useTry("finish",false); }
      const pick=b.dataset.w; mine[i]=pick;
      document.querySelectorAll("#panel .opt").forEach(x=>x.disabled=true); b.classList.add("picked");
      if(!theirs){ marks[i]="saved"; sfx("new"); return setTimeout(()=>{ i++; if(i<r.qs.length) step(); else done(); }, 450); }
      const same = pick===theirs[i]; marks[i]=same;
      if(same){ b.classList.add("right"); b.querySelector(".os").textContent=t("mtSameTag"); }
      else { b.classList.add("wrong"); b.querySelector(".os").textContent=t("yourPick");
        const o=$(`#panel .opt[data-w="${theirs[i]}"]`); if(o){ o.classList.add("picked"); o.querySelector(".os").textContent=nameOf(other()); } }
      stageReact(same, same ? t("mtSame") : t("mtDiff",{n:nameOf(other())}));
      setTimeout(()=>{ i++; if(same && i<r.qs.length) step(); else done(); }, same?1100:1700);
    });
  };
  const done = () => {
    r[me()] = {ans:mine, at:Date.now()};
    if(!theirs){ save(); notify(`${nameOf(me())} played Who's more likely? Answer the same 5 and see if you match.`, `${nameOf(me())} jugó ¿Quién es más probable? Responde las mismas 5 y vean si coinciden.`); return matchSaved(); }
    const n = marks.filter(x=>x===true).length, coins = Math.floor(n/2), bonus = n===r.qs.length;
    ["her","andrew"].forEach(p=>asPlayer(p, ()=>{ ST().coins += coins; if(bonus && !awardRaw("regular","match")) ST().coins++; }));
    r.result = {n, coins, bonus, by:me(), at:Date.now(), seen:{}};
    const w=week(); if(w.log.length) w.log[w.log.length-1].won = n>0; save(); badge();
    notify(`Who's more likely: you matched ${n} of ${r.qs.length}. +${coins} coins each${bonus?" and a bonus coupon":""}.`, `¿Quién es más probable?: coincidieron en ${n} de ${r.qs.length}. +${coins} monedas para cada uno${bonus?" y un cupón de bono":""}.`);
    matchResult(r, true);
  };
  step();
}
function matchSaved(){
  openSheet(`<div class="result"><img class="big sticker" src="${duck("traveler")}" alt=""><h3>${t("mtSaved")}</h3><p class="hint">${t("mtWait",{n:nameOf(other())})}</p>
    <div class="row-btns"><button class="btn" type="button" data-close>${t("close")}</button></div></div>`); }
function matchResult(r, fresh){
  const {n, coins, bonus} = r.result, tot = r.qs.length, mine = (r[me()]||{}).ans||[], theirs = (r[other()]||{}).ans||[];
  (r.result.seen ||= {})[me()] = true; save();
  const rows = r.qs.map((k,i)=>{ const a=mine[i], b=theirs[i]; if(a==null || b==null) return ""; const same=a===b;
    return `<li class="${same?"ok":"no"}"><span>${esc(matchQ(k))}</span><b>${same?"✓ "+esc(whoLabel(a)):"✗ "+t("mtYou")+": "+esc(whoLabel(a))+" · "+esc(nameOf(other()))+": "+esc(whoLabel(b))}</b></li>`; }).join("");
  openSheet(`<div class="result"><img class="big sticker" src="${duck(n===tot?"sunbed":n?"traveler":"donotdisturb")}" alt=""><h3>${n===tot?t("win"):t("mtScore",{n,t:tot})}</h3>
    ${coins?`<p class="coin-won"><span class="coin-spin">🪙</span> ${t("mtCoins",{n:coins})}</p>`:`<p class="hint">${t("mtNone")}</p>`}
    ${bonus?`<p class="note" style="text-align:center">${t("mtBonus")}</p>`:""}
    <ul class="mlist">${rows}</ul>
    <div class="row-btns">${coins?`<button class="btn" type="button" data-shop>${t("buyPack")}</button>`:""}<button class="btn ghost" type="button" data-close>${t("close")}</button></div></div>`);
  if(fresh){ if(coins){ sfx("win"); setTimeout(()=>sfx("coin"),450); confetti(); } else sfx("lose"); }
}

/* scratch */
function openScratch(){
  useTry("scratch", false);
  const names = ["doorman","lobbyboy","bellboy","concierge","richwoman","richman","suitcasekid","sunbed","donotdisturb","traveler","founder","farmer","gardener","sprayer","pig","rabbit","scarecrow","ricesack","digger","peach","beetroot","orange","potato"];
  const won = Math.random() < 0.20;
  const kinds = shuffle(names);
  let cells;
  if(won) cells = shuffle([kinds[0],kinds[0],kinds[0],kinds[1],kinds[1],kinds[2],kinds[2],kinds[3],kinds[3]]);
  else cells = shuffle([kinds[0],kinds[0],kinds[1],kinds[1],kinds[2],kinds[2],kinds[3],kinds[3],kinds[4]]);
  openSheet(`<h3>${t("g_scratch")}</h3><p class="hint">${t("scratchHelp")}</p>
    <div class="scratch"><div class="grid">${cells.map(n=>`<div class="cell" data-n="${n}"><img src="${duck(n)}" alt=""></div>`).join("")}</div><canvas id="foil"></canvas></div>
    <div class="row-btns"><button class="btn ghost" type="button" id="revealAll">${t("revealAll")}</button></div>`);
  const cv = $("#foil"), box = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio||1);
  cv.width = box.width*dpr; cv.height = box.height*dpr;
  const g = cv.getContext("2d"); g.scale(dpr,dpr);
  const grad = g.createLinearGradient(0,0,box.width,box.height);
  grad.addColorStop(0,"#e4b4ba"); grad.addColorStop(.5,"#d99aa3"); grad.addColorStop(1,"#ecc3c9");
  g.fillStyle=grad; g.fillRect(0,0,box.width,box.height);
  g.fillStyle="rgba(247,246,236,.75)"; g.font="500 15px 'Oswald', sans-serif"; g.textAlign="center";
  for(let y=26;y<box.height;y+=38) for(let x=(y/38%2?30:60);x<box.width;x+=90) { g.save(); g.translate(x,y); g.rotate(-.25); g.fillText(L()==="es"?"rasca ♡":"scratch ♡",0,0); g.restore(); }
  g.globalCompositeOperation="destination-out"; g.lineCap="round"; g.lineJoin="round"; g.lineWidth=34;
  let down=false, last=null, done=false, moves=0;
  const pt = e => { const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
  cv.addEventListener("pointerdown", e=>{ down=true; last=pt(e); cv.setPointerCapture(e.pointerId); scratch(last); });
  cv.addEventListener("pointermove", e=>{ if(!down) return; const p=pt(e); g.beginPath(); g.moveTo(last.x,last.y); g.lineTo(p.x,p.y); g.stroke(); last=p; if(++moves%12===0) check(); });
  const up = ()=>{ down=false; check(); }; cv.addEventListener("pointerup",up); cv.addEventListener("pointercancel",up);
  function scratch(p){ g.beginPath(); g.arc(p.x,p.y,17,0,7); g.fill(); }
  function check(){ if(done) return; const d=g.getImageData(0,0,cv.width,cv.height).data; let clear=0,tot=0;
    for(let i=3;i<d.length;i+=4*40){ tot++; if(d[i]===0) clear++; } if(clear/tot>0.6) reveal(); }
  function reveal(){ if(done) return; done=true; cv.style.transition="opacity .5s"; cv.style.opacity=0; setTimeout(()=>cv.remove(),500);
    if(won) document.querySelectorAll(".scratch .cell").forEach(c=>{ if(c.dataset.n===kinds[0]) c.classList.add("hit"); });
    const w=week(); w.log[w.log.length-1].won=won; save();
    setTimeout(()=>{ const grid = $(".scratch").outerHTML.replace(/<canvas[^>]*><\/canvas>/,""); showResult(won?"scratch":false, grid); }, 1300); }
  $("#revealAll").onclick = reveal;
}

/* lenguaje del amor: open answer, Claude decides (yes / close with a subtle hint / no). Falls back to multiple choice if Claude isn't available. */
let SAMPLE = null; (async()=>{ try{ SAMPLE = await window.claude?.use?.("sample"); }catch(e){ SAMPLE=null; } if(SAMPLE && typeof tab!=="undefined" && tab==="play") render(); })();
const LOVE_OPEN = {ask:3, tries:5};
function loveAnswer(q){ if(isA()) return C.loveOptions[q.a] ? tx(C.loveOptions[q.a]) : String(q.a); return q.opts ? tx(q.opts[0]) : tx(C.loveOptions[q.a]); }
async function judgeLove(question, answer, guess, past){
  const lang = L()==="es" ? "Spanish" : "English";
  const prompt = `You judge a sweet couples game. One partner wrote a question about themself and their real answer. The other partner typed a guess.
Question: ${question}
Real answer: ${answer}
Guess: ${guess}
${past.length?`Earlier wrong guesses: ${past.map(x=>x.g).join(" | ")}\nHints already given: ${past.map(x=>x.h).filter(Boolean).join(" | ")||"none"}\n`:""}Decide:
- "yes" if the guess matches the meaning of the real answer (synonyms, different words, partial lists that hit the main idea are fine; be generous).
- "close" if it is on the right track but misses the main idea.
- "no" otherwise.
If "close", write a very subtle, playful hint in ${lang}, at most 10 words, that nudges without revealing any word of the real answer, and is different from the hints already given.
Reply with JSON only: {"verdict":"yes"|"close"|"no","hint":"..."}`;
  const r = await SAMPLE.json(prompt, {modelTier:"quick", cache:false});
  const v = String(r?.verdict||"no").toLowerCase();
  return {verdict: ["yes","close","no"].includes(v)?v:"no", hint: String(r?.hint||"")};
}
function openLove(){
  if(!SAMPLE) return openQuiz("love");
  const pool = shuffle(remaining("love")).slice(0, LOVE_OPEN.ask);
  if(!pool.length) return toast(t("allDone"));
  const marks=[]; let i=0, started=false, past=[];
  const dots = cur => `<div class="progress">${pool.map((_,k)=>`<i class="${marks[k]===true?"ok":marks[k]===false?"no":k===cur?"now":""}"></i>`).join("")}</div>`;
  const step = (msg="") => {
    const q=pool[i], text = isA()? q.s : tx(q), left = LOVE_OPEN.tries - past.length;
    openSheet(`${stageHTML("love", i, pool.length, marks, text, msg?`<span class="react hintr">${esc(msg)}</span>`:"")}
      <form id="lf"><div class="field"><textarea id="lText" style="min-height:80px" placeholder="${esc(t("loveOpenPh"))}" aria-label="${esc(t("loveOpenPh"))}" maxlength="240" required></textarea></div>
      <p class="hint" style="text-align:center">${t("loveLeft",{n:left})}</p>
      <div class="row-btns"><button class="btn" type="submit" id="lGo">${t("loveCheck")}</button></div></form>`);
    $("#lText").focus();
    $("#lf").onsubmit = async e => { e.preventDefault(); const guess=$("#lText").value.trim(); if(!guess) return;
      const btn=$("#lGo"); btn.disabled=true; btn.textContent=t("judging");
      let res; try{ res = await judgeLove(text, loveAnswer(q), guess, past); }
      catch(err){ btn.disabled=false; btn.textContent=t("loveCheck"); if(err?.code==="not_granted"){ SAMPLE=null; return openQuiz("love"); } return toast(t("loveErr")); }
      if(!started){ started=true; useTry("love",false); }
      if(res.verdict!=="yes"){
        past.push({g:guess, h:res.verdict==="close"?res.hint:""});
        if(past.length < LOVE_OPEN.tries){ step(res.verdict==="close" ? "💡 "+t("loveClose")+" "+(res.hint||"") : t("loveNo")); return stageReact(false); }
        marks[i]=false; const w=week(); w.log[w.log.length-1].won=false; save();
        return showResult(false, `${dots(-1)}<p class="hint" style="text-align:center">${t("loveOut")}</p>`);
      }
      marks[i]=true; past=[];
      if(!M().love.includes(q.key)){ M().love.push(q.key); save(); }
      openSheet(`${stageHTML("love", i, pool.length, marks, t("loveYes"), `<small class="was">${t("loveWas")} <b>${esc(loveAnswer(q))}</b></small>`)}
        <div class="row-btns"><button class="btn" type="button" id="lNext">${i+1<pool.length?t("next"):t("seeResult")}</button></div>`); stageReact(true);
      $("#lNext").onclick=()=>{ i++; if(i<pool.length) step(); else { const w=week(); w.log[w.log.length-1].won=true; save(); showResult("love", `<p class="q">${t("score",{n:pool.length,t:pool.length})}</p>`); } };
    };
  };
  step();
}

const idb = (()=>{ let dbp;
  const open=()=>dbp ||= new Promise((res,rej)=>{ const r=indexedDB.open("casita-photos",1); r.onupgradeneeded=()=>r.result.createObjectStore("p"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
  const run=(mode,fn)=>open().then(db=>new Promise((res,rej)=>{ const tr=db.transaction("p",mode), q=fn(tr.objectStore("p")); tr.oncomplete=()=>res(q&&q.result); tr.onerror=()=>rej(tr.error); }));
  return {put:(k,v)=>run("readwrite",st=>st.put(v,k)), get:k=>run("readonly",st=>st.get(k)), del:k=>run("readwrite",st=>st.delete(k))};
})();
const urlCache = {};
async function photoURL(key){ if(urlCache[key]) return urlCache[key]; try{ const b=await idb.get(key); if(b) return urlCache[key]=URL.createObjectURL(b); }catch(e){} return ""; }
async function shrink(file, max, q){ const bmp = await createImageBitmap(file); const sc=Math.min(1, max/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas"); c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc); c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(r,"image/jpeg",q)); }
