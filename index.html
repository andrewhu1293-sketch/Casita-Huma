const blankStk = () => ({own:{}, shiny:{}, coins:0, wins:0, loose:[], pages:[]});
S.stk ||= {}; S.stk.her ||= blankStk(); S.stk.andrew ||= blankStk();
["her","andrew"].forEach(p=>{ const o=S.stk[p]; if(o.packs){ o.coins=(o.coins||0)+o.packs; delete o.packs; } o.coins ||= 0; o.wins ||= 0; o.loose ||= []; o.pages ||= []; o.own ||= {}; o.shiny ||= {}; });
S.letter ||= {andrew:"", her:""}; S.letterSeen ||= {}; S.secrets ||= {andrew:"", her:""}; S.eggs ||= {her:[], andrew:[]};
S.stkMeta ||= {}; if(S.stkCap){ for(const k in S.stkCap){ (S.stkMeta[k] ||= {}).story = S.stkCap[k]; } delete S.stkCap; }
S.custom ||= [];
if(S.sound===undefined) S.sound = true;
const ST = () => S.stk[me()];
const PAGE = 6, CUTS = 10, BGS = ["var(--blue)","var(--pink)","var(--lav)","#f6efc0","#92c2ec","var(--rose2)"];
function stickers(){
  const base = [...Array(CUTS)].map((_,i)=>({id:"p"+(i+1), src:`people/p${i+1}.webp`, frame:"cut"}));
  const cus = S.custom.slice().sort((a,b)=>a.at-b.at).map(c=>({id:c.id, custom:true, frame:c.frame}));
  return [...base, ...cus].map((s,i)=>Object.assign(s,{n:i+1, title:(S.stkMeta[s.id]||{}).title||"", story:(S.stkMeta[s.id]||{}).story||""}));
}
const pagesOf = all => { const out=[]; for(let i=0;i<all.length;i+=PAGE) out.push(all.slice(i,i+PAGE)); return out; };
const lines = s => String(s||"").split(/\n+/).map(x=>x.trim()).filter(Boolean);
const pad = n => String(n).padStart(2,"0");

/* sounds: tiny synth, no files */
let AC = null;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } } if(AC.state==="suspended") AC.resume(); return AC; }
function tone(f, at, dur, type="triangle", vol=.12, f2){ const a=ac(); if(!a) return; const o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(f, at); if(f2) o.frequency.exponentialRampToValueAtTime(f2, at+dur);
  g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol, at+.015); g.gain.exponentialRampToValueAtTime(0.0001, at+dur);
  o.connect(g).connect(a.destination); o.start(at); o.stop(at+dur+.05); }
function sfx(k){ if(S.sound===false) return; const a=ac(); if(!a) return; const n=a.currentTime;
  if(k==="tick") tone(1200,n,.05,"sine",.035);
  if(k==="win") [523,659,784,1047].forEach((f,i)=>tone(f,n+i*.09,.22,"triangle",.14));
  if(k==="lose") { tone(440,n,.18,"sine",.09); tone(349,n+.16,.3,"sine",.09); }
  if(k==="coin") { tone(988,n,.08,"square",.05); tone(1319,n+.08,.3,"square",.05); }
  if(k==="flip") tone(500,n,.12,"square",.035,1100);
  if(k==="pack") { tone(180,n,.35,"sawtooth",.04,1400); tone(900,n+.3,.12,"triangle",.08,1500); }
  if(k==="new") [784,988,1319].forEach((f,i)=>tone(f,n+i*.08,.2,"triangle",.12));
  if(k==="paste") { tone(220,n,.08,"sine",.18,110); tone(1568,n+.05,.12,"triangle",.06); }
  if(k==="shiny") for(let i=0;i<9;i++) tone(1500+Math.random()*1800,n+i*.06,.14,"sine",.07);
  if(k==="page") [523,659,784,659,784,1047].forEach((f,i)=>tone(f,n+i*.11,.26,"triangle",.14));
  if(k==="egg") [988,784,1175,1568].forEach((f,i)=>tone(f,n+i*.1,.2,"sine",.12));
}
document.addEventListener("pointerdown", e=>{ ac(); if(e.target.closest("button")) sfx("tick"); }, {passive:true});

/* confetti rain */
function confetti(n=70){ if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cols=["#d14735","#efe84c","#bcdaf7","#ecc3c9","#92c2ec","#4a2a1a"];
  for(let i=0;i<n;i++){ const d=document.createElement("span"); d.className="cf"+(i%5===0?" h":"");
    if(i%5===0){ d.textContent="♥"; d.style.color=cols[i%cols.length]; } else d.style.background=cols[i%cols.length];
    d.style.left=(Math.random()*100)+"vw"; d.style.setProperty("--d",(1.6+Math.random()*1.4).toFixed(2)+"s"); d.style.animationDelay=(Math.random()*.5).toFixed(2)+"s";
    d.style.setProperty("--x",(Math.random()*80-40).toFixed(0)+"px"); d.style.setProperty("--r",(Math.random()*720-360).toFixed(0)+"deg");
    document.body.appendChild(d); setTimeout(()=>d.remove(),3600); }
}

/* one design for every mona: palette background + big arc, the photo in its shape, number, red ribbon with the title */
function monaHTML(s, o={}){
  const bg = BGS[(s.n-1)%BGS.length], shiny = o.shiny ?? !!ST().shiny[s.id];
  const img = s.custom ? `<img class="ph fr-${s.frame}" data-k="s-${s.id}" alt="">` : `<img class="cut" src="${s.src}" alt="">`;
  const tag = o.button ? "button" : "div";
  return `<${tag} ${o.button?`type="button" data-stk="${s.id}"`:""} ${o.slot?`data-slot="${o.slot}"`:""} class="stk own ${shiny?"shiny":""} ${o.cls||""}" style="--bg:${bg}">
    <span class="arc"></span>${img}<i class="no">${pad(s.n)}</i>${s.title?`<b class="rb">${esc(s.title)}</b>`:""}${o.dup?`<b class="dup">x${o.dup}</b>`:""}</${tag}>`;
}
function slotHTML(s){
  const own = ST().own[s.id]||0;
  return own ? monaHTML(s,{button:true, dup: own>1?own:0, slot:s.id}) : `<div class="stk miss" data-slot="${s.id}"><span>${pad(s.n)}</span></div>`;
}
const thumbCache = {};
async function stkURL(id){ if(thumbCache[id]) return thumbCache[id]; try{ const b=await idb.get("s-"+id); if(b) return thumbCache[id]=URL.createObjectURL(b); }catch(e){} return ""; }
const fillThumbs = () => document.querySelectorAll("img[data-k^='s-']").forEach(async im=>{ if(!im.getAttribute("src")) im.src = await stkURL(im.dataset.k.slice(2)); });

/* sealed letter: one line per share of the album filled */
function letterInfo(){
  const author = other(), L2 = lines(S.letter[author]), all = stickers(), have = all.filter(s=>ST().own[s.id]).length;
  let n = have>=all.length ? L2.length : Math.floor(L2.length*have/all.length);
  n = Math.min(L2.length, Math.max(n, S.letterSeen[me()]||0));
  return {author, L:L2, n};
}
const scramble = s => s.replace(/\S/g, ()=>"abcdefghilmnoprstu"[Math.floor(Math.random()*18)]);
function letterHTML(){ const li = letterInfo();
  return `<button type="button" class="letter" id="letterBtn"><span class="seal">♥</span>
    <b>${t("letterTitle",{a:nameOf(li.author)})}</b><small>${li.L.length?t("letterLines",{n:li.n,t:li.L.length}):t("letterEmpty",{a:nameOf(li.author)})}</small></button>`; }
function openLetter(){ const li = letterInfo();
  openSheet(`<h3>${t("letterTitle",{a:nameOf(li.author)})}</h3><p class="hint" style="text-align:center">${t("letterLead")}</p>
    <div class="letter-paper">${li.L.length ? li.L.map((x,i)=>i<li.n?`<p>${esc(x)}</p>`:`<p class="blur" aria-hidden="true">${esc(scramble(x))}</p>`).join("") : `<p>${t("letterEmpty",{a:nameOf(li.author)})}</p>`}</div>`); }

/* hidden secrets */
const EGGS = [{id:"logo", sel:".logo .us", n:5}, {id:"h-play", sel:"#view h2.sec", tab:"play", n:3}, {id:"h-wallet", sel:"#view h2.sec", tab:"wallet", n:3},
  {id:"h-album", sel:"#view h2.sec", tab:"album", n:3}, {id:"h-therapy", sel:"#view h2.sec", tab:"therapy", n:3}];
const eggTaps = {};
document.addEventListener("click", e=>{
  for(const g of EGGS){ const el = e.target.closest(g.sel); if(!el || (g.tab && g.tab!==tab)) continue;
    if(g.tab && el!==$("#view h2.sec")) continue;
    const now=Date.now(), c=eggTaps[g.id]; eggTaps[g.id] = c && now-c.at<1200 ? {n:c.n+1, at:now} : {n:1, at:now};
    if(eggTaps[g.id].n>=g.n){ eggTaps[g.id]=null; foundEgg(g.id); } }
});
function foundEgg(id){
  const mine = S.eggs[me()] ||= []; if(mine.includes(id)) return;
  mine.push(id); ST().coins++; save();
  const sec = lines(S.secrets[other()])[mine.length-1];
  notify(`${nameOf(me())} found a hidden secret (${mine.length}/${EGGS.length})`, `${nameOf(me())} encontró un secreto escondido (${mine.length}/${EGGS.length})`);
  openSheet(`<div class="result egg"><img class="egg-pic" src="people/p${1+Math.floor(Math.random()*CUTS)}.webp" alt=""><h3>${t("eggTitle")}</h3>
    <p class="q egg-msg">${sec?esc(sec):t("eggEmpty",{a:nameOf(other())})}</p><p class="coin-won">🪙 ${t("eggBonus")}</p><p class="hint">${t("eggCount",{n:mine.length,t:EGGS.length})}</p>
    <div class="row-btns"><button class="btn" type="button" data-shop>${t("buyPack")}</button></div></div>`);
  sfx("egg"); confetti(50); render();
}

/* coins and wins: a coin per game won, a coupon every 3 wins */
function winRewards(from){
  ST().coins++; ST().wins++; save();
  const got = ST().wins % 3 === 0 ? award("regular", from) : null;
  return {got, n: ST().wins % 3 || (got ? 3 : 0)};
}
function winDots(n){ return `<div class="wdots" aria-label="${esc(t("toCoupon",{n}))}">${[0,1,2].map(i=>`<i class="${i<n?"on":""}"></i>`).join("")}<span>🎟️</span></div><p class="hint" style="text-align:center">${t("toCoupon",{n})}</p>`; }
document.addEventListener("click", e=>{ if(e.target.closest("[data-shop]")){ tab="album"; closeSheet(); window.scrollTo(0,0); } });

/* packs: buy with a coin, 3 monas, duplicates possible */
function drawMona(){
  const all = stickers(), missing = all.filter(s=>!ST().own[s.id] && !ST().loose.some(l=>l.id===s.id));
  const pool = missing.length && Math.random()<0.5 ? missing : all;
  const s = pool[Math.floor(Math.random()*pool.length)]; return {id:s.id, shiny: Math.random()<0.08};
}
function buyPack(){
  if(ST().coins<=0) return toast(t("noCoins"));
  ST().coins--; const items=[drawMona(),drawMona(),drawMona()]; ST().loose.push(...items); save();
  notify(`${nameOf(me())} opened a sticker pack`, `${nameOf(me())} abrió un sobre de monas`);
  openSheet(`<h3>${t("packNew")}</h3><p class="hint" style="text-align:center" id="packHint">${t("packTap")}</p>
    <button type="button" class="pack" id="packEnv" aria-label="${esc(t("packTap"))}"><span class="flap"></span><img src="ducks/us.webp" alt=""><b>Casita Huma</b><small>${t("stkTitle")}</small></button>`);
  $("#packEnv").onclick = () => {
    const env=$("#packEnv"); if(env.classList.contains("open")) return; env.classList.add("open"); sfx("pack");
    setTimeout(()=>{
      $("#packHint").textContent = t("packFlip");
      const all = stickers();
      env.outerHTML = `<div class="picks three">${items.map((it,i)=>{ const s=all.find(x=>x.id===it.id);
        return `<button type="button" class="pick" data-i="${i}"><span class="back">?</span><span class="front">${monaHTML(s,{shiny:it.shiny})}</span><em class="lab"></em></button>`; }).join("")}</div><div id="pickOut"></div>`;
      fillThumbs(); let flipped=0;
      document.querySelectorAll(".pick").forEach(p=>p.onclick=()=>{ if(p.classList.contains("flip")) return; p.classList.add("flip");
        const it=items[+p.dataset.i], dup = (ST().own[it.id] && !(it.shiny && !ST().shiny[it.id])) || items.slice(0,+p.dataset.i).some(x=>x.id===it.id);
        p.querySelector(".lab").textContent = it.shiny ? t("stkShiny") : dup ? t("stkDup") : t("stkNew"); if(dup&&!it.shiny) p.classList.add("isdup");

function pasteMona(idx){

  const el = $(`[data-stk="${it.id}"]`); if(el){ el.classList.add("just"); el.scrollIntoView({block:"center", behavior:"smooth"}); }

/* drag a mona from the tray onto its numbered spot */
function dragMona(el){
  const idx = +el.dataset.paste, it = ST().loose[idx], s = stickers().find(x=>x.id===it?.id); if(!s) return;
  let start=null, ghost=null, target=null, raf=0, lastY=0, lastX=0, moved=false;
  const end = () => { cancelAnimationFrame(raf); document.removeEventListener("pointermove",move); document.removeEventListener("pointerup",up); document.removeEventListener("pointercancel",cancel); };
  const over = (x,y) => { if(ghost) ghost.style.visibility="hidden"; const hit=document.elementFromPoint(x,y); if(ghost) ghost.style.visibility=""; return hit && hit.closest("[data-slot]"); };
  const scroll = () => { if(lastY > innerHeight-120) scrollBy(0,14); else if(lastY < 110) scrollBy(0,-14); raf = requestAnimationFrame(scroll); };
  function begin(e){ moved=true; el.classList.add("lifting"); target=$(`[data-slot="${s.id}"]`); if(target) target.classList.add("target");
    const r=el.getBoundingClientRect(); ghost=el.querySelector(".stk").cloneNode(true); ghost.classList.add("dghost"); ghost.style.width=r.width+"px";
    document.body.appendChild(ghost); sfx("flip"); scroll(); place(e); }
  function place(e){ ghost.style.transform=`translate(${e.clientX-ghost.offsetWidth/2}px,${e.clientY-ghost.offsetHeight*.6}px) rotate(-6deg) scale(1.08)`; lastY=e.clientY; lastX=e.clientX;
    const o=over(e.clientX,e.clientY); document.querySelectorAll(".stk.hover").forEach(x=>x.classList.remove("hover")); if(o) o.classList.add("hover"); }
  function move(e){ if(!start) return; const dx=e.clientX-start.x, dy=e.clientY-start.y;
    if(!moved){ if(Math.hypot(dx,dy)>6) begin(e); return; }
    e.preventDefault(); place(e); }
  function finish(e, ok){ end(); el.classList.remove("lifting"); document.querySelectorAll(".stk.hover,.stk.target").forEach(x=>x.classList.remove("hover","target"));
    if(!moved){ if(start) toast(t("dragTip",{n:pad(s.n)})); start=null; return; }
    const o = over(lastX,lastY);
    if(o && o.dataset.slot===s.id){ ghost.remove(); pasteMona(idx); }
    else { if(o) toast(t("wrongSlot",{n:pad(s.n)})); const r=el.getBoundingClientRect(); ghost.style.transition="transform .35s cubic-bezier(.3,1.4,.5,1)";
      ghost.style.transform=`translate(${r.left}px,${r.top}px)`; setTimeout(()=>ghost.remove(),380); if(o){ o.classList.add("nope"); setTimeout(()=>o.classList.remove("nope"),500); sfx("lose"); } }
    start=null; moved=false; }
  const up = e => { if(moved) place(e); finish(e,true); }, cancel = e => finish(e,true);
  el.addEventListener("pointerdown", e=>{ if(start) return; start={x:e.clientX,y:e.clientY}; moved=false; try{ el.setPointerCapture(e.pointerId); }catch(_){}
    document.addEventListener("pointermove",move,{passive:false}); document.addEventListener("pointerup",up); document.addEventListener("pointercancel",cancel); });
  el.addEventListener("touchmove", e=>{ if(start) e.preventDefault(); }, {passive:false});
  el.addEventListener("contextmenu", e=>e.preventDefault());
  el.addEventListener("click", e=>e.preventDefault()); el.addEventListener("dragstart", e=>e.preventDefault());
}

  $("#mkFile").onchange = async e => { const f=e.target.files[0]; if(!f) return;
    try{ const bmp = await createImageBitmap(f); const sc=Math.min(1, 900/Math.max(bmp.width,bmp.height)); const c=document.createElement("canvas");
      c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc); const g=c.getContext("2d"); g.drawImage(bmp,0,0,c.width,c.height);
      const px = g.getImageData(0,0,c.width,c.height).data; let clear=0; for(let i=3;i<px.length;i+=4*97) if(px[i]<200) clear++; mkAlpha = clear > px.length/4/97*0.08;
      mkBlob = await new Promise(r=>c.toBlob(r, mkAlpha?"image/png":"image/jpeg", .86));
      if(mkURL) URL.revokeObjectURL(mkURL); mkURL = URL.createObjectURL(mkBlob);
      $("#mkFrame").value = mkAlpha ? "cut" : ($("#mkFrame").value==="cut" ? "arch" : $("#mkFrame").value);
      $("#mkAdd").disabled=false; mkPreview(); }catch(err){ toast(t("alFail")); } };

    thumbCache[id]=mkURL; mkURL=""; mkBlob=null; save();

}

  if(seen || matchMedia("(prefers-reduced-motion: reduce)").matches){ sp.remove(); return; }
  $("#spSub").textContent = t("loadSub");
  const word = t("loading"); let n=0, done=false;
  const close=()=>{ if(done) return; done=true; sp.classList.add("out"); setTimeout(()=>sp.remove(),650); try{ sessionStorage.setItem("casita-splash","1"); }catch(e){} };
  const tick=()=>{ n=Math.min(100,n+Math.ceil(Math.random()*9)); title.textContent=`${word} ${n}%`;
    if(n<100) return setTimeout(tick,95);
    setTimeout(()=>{ title.classList.add("name"); title.innerHTML="Casita Huma".split(" ").map((w,wi)=>`<div>${[...w].map((c,i)=>`<span style="animation-delay:${wi*0.18+i*0.04}s">${esc(c)}</span>`).join("")}</div>`).join(""); setTimeout(close,1500); },250); };
  /* our photos pop in all over the screen while it loads */
  const order=[...Array(10)].map((_,i)=>i+1).sort(()=>Math.random()-.5);
  const spots=[[4,8],[52,6],[2,36],[56,34],[10,62],[54,60],[28,20],[30,48],[6,80],[50,82]].sort(()=>Math.random()-.5);
  order.forEach((n,i)=>setTimeout(()=>{ if(done) return; const im=new Image(); im.src=`people/p${n}.webp`; im.alt=""; im.className="sp-pic";
    const [x,y]=spots[i]; im.style.left=(x+Math.random()*6-3)+"%"; im.style.top=(y+Math.random()*6-3)+"%";
    im.style.setProperty("--r",(Math.random()*36-18).toFixed(1)+"deg"); im.style.width=(34+Math.random()*12).toFixed(0)+"vw";
    sp.insertBefore(im, sp.firstChild); }, 120+i*240));
  tick(); sp.addEventListener("click", close);
})();

document.addEventListener("click", e=>{ if(e.target.closest(".streak")) toast(t("stRule")); });
/* little confetti burst on every button tap */
document.addEventListener("pointerdown", e=>{
  const b = e.target.closest("button"); if(!b || b.disabled || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cols=["#d14735","#efe84c","#bcdaf7","#ecc3c9","#4a2a1a"];
  for(let i=0;i<7;i++){ const d=document.createElement("span"); const ang=Math.random()*Math.PI*2, r=28+Math.random()*26;
    d.className="burst"+(i%3===0?" h":""); if(i%3===0){ d.textContent="♥"; d.style.color=cols[i%4]; } else d.style.background=cols[i%cols.length];
    d.style.left=e.clientX+"px"; d.style.top=e.clientY+"px"; d.style.setProperty("--dx",Math.cos(ang)*r+"px"); d.style.setProperty("--dy",Math.sin(ang)*r+"px");
    document.body.appendChild(d); setTimeout(()=>d.remove(),650); }
}, {passive:true});
})();
</script>

<script>if("serviceWorker" in navigator){ addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }</script>
