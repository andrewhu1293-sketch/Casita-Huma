/* settings / her tab: write the letter and the secrets; Andrew also titles stickers and makes new ones */
function surprisesHTML(author){
  return `<div class="card surp"><h4>${t(author==="andrew"?"surpA":"surpH")}</h4>
    <div class="field"><label for="sLetter">${t("surpLetter")}</label><textarea id="sLetter" style="min-height:120px">${esc(S.letter[author]||"")}</textarea></div>
    <div class="field"><label for="sSecrets">${t("surpSecrets")}</label><textarea id="sSecrets" style="min-height:90px">${esc(S.secrets[author]||"")}</textarea></div>
    ${author==="andrew"?`<p class="hint"><b>${t("surpStories")}</b></p><div class="stories">${stickers().map(s=>`<div class="story"><div class="mini">${monaHTML(s,{shiny:false})}</div><div class="story-f">
      <input type="text" data-title="${s.id}" maxlength="18" placeholder="${esc(t("surpTitlePh"))}" value="${esc(s.title)}" aria-label="${esc(t("surpTitlePh"))} ${s.n}">
      <input type="text" data-story="${s.id}" maxlength="160" placeholder="${esc(t("surpStoryPh"))}" value="${esc(s.story)}" aria-label="${esc(t("surpStoryPh"))} ${s.n}">
      ${s.custom?`<button type="button" class="linkbtn" data-delstk="${s.id}">${t("remove")}</button>`:""}</div></div>`).join("")}</div>
      <label class="hint" style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" id="sSound" ${S.sound!==false?"checked":""}> ${t("soundOn")}</label>`:""}
    <button class="btn small" type="button" id="sSave">${t("save")}</button></div>
    ${author==="andrew"?makerHTML():""}`;
}
function bindSurprises(author){
  $("#sSave").onclick=()=>{ S.letter[author]=$("#sLetter").value; S.secrets[author]=$("#sSecrets").value;
    document.querySelectorAll("[data-title]").forEach(i=>(S.stkMeta[i.dataset.title] ||= {}).title=i.value.trim());
    document.querySelectorAll("[data-story]").forEach(i=>(S.stkMeta[i.dataset.story] ||= {}).story=i.value.trim());
    if($("#sSound")) S.sound=$("#sSound").checked; save(); toast(t("saved")); };
  fillThumbs();
  if(author!=="andrew") return;
  document.querySelectorAll("[data-delstk]").forEach(b=>b.onclick=async()=>{ const id=b.dataset.delstk; S.custom=S.custom.filter(c=>c.id!==id);
    ["her","andrew"].forEach(p=>{ delete S.stk[p].own[id]; S.stk[p].loose=S.stk[p].loose.filter(l=>l.id!==id); }); try{ await idb.del("s-"+id); }catch(e){} save(); render(); });
  bindMaker();
}

/* sticker maker: any photo takes the album's design (palette background, arc, shape, ribbon) */
let mkBlob = null, mkAlpha = false;
function makerHTML(){
  return `<div class="card maker"><h4>${t("mkTitle")}</h4><p class="hint">${t("mkLead")}</p>
    <label class="btn small upl" for="mkFile">${t("mkFile")}</label><input id="mkFile" type="file" accept="image/*" hidden>
    <div class="mk-row"><div class="mk-prev" id="mkPrev"></div><div class="mk-opts">
      <div class="field"><label for="mkFrame">${t("mkFrame")}</label><select id="mkFrame">${["arch","heart","stamp","circle","cut"].map(f=>`<option value="${f}">${t("fr_"+f)}</option>`).join("")}</select></div>
      <div class="field"><label for="mkT">${t("surpTitlePh")}</label><input id="mkT" type="text" maxlength="18"></div>
      <div class="field"><label for="mkS">${t("surpStoryPh")}</label><input id="mkS" type="text" maxlength="160"></div></div></div>
    <p class="hint">${t("mkHint")}</p>
    <button class="btn small" type="button" id="mkAdd" disabled>${t("mkAdd")}</button></div>`;
}
let mkURL = "";
function mkPreview(){
  const n = stickers().length + 1, s = {id:"preview", n, custom:true, frame:$("#mkFrame").value, title:$("#mkT").value.trim()};
  $("#mkPrev").innerHTML = monaHTML(s,{shiny:false}); const im=$("#mkPrev img.ph"); if(im && mkURL) im.src=mkURL;
}
function bindMaker(){
  mkBlob=null; mkPreview();
  $("#mkFrame").onchange = mkPreview; $("#mkT").oninput = mkPreview;
  $("#mkFile").onchange = async e => { const f=e.target.files[0]; if(!f) return;
    try{ const bmp = await createImageBitmap(f); const sc=Math.min(1, 900/Math.max(bmp.width,bmp.height)); const c=document.createElement("canvas");
      c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc); const g=c.getContext("2d"); g.drawImage(bmp,0,0,c.width,c.height);
      const px = g.getImageData(0,0,c.width,c.height).data; let clear=0; for(let i=3;i<px.length;i+=4*97) if(px[i]<200) clear++; mkAlpha = clear > px.length/4/97*0.08;
      mkBlob = await new Promise(r=>c.toBlob(r, mkAlpha?"image/png":"image/jpeg", .86));
      if(mkURL) URL.revokeObjectURL(mkURL); mkURL = URL.createObjectURL(mkBlob);
      $("#mkFrame").value = mkAlpha ? "cut" : ($("#mkFrame").value==="cut" ? "arch" : $("#mkFrame").value);
      $("#mkAdd").disabled=false; mkPreview(); }catch(err){ toast(t("alFail")); } };
  $("#mkAdd").onclick = async () => { if(!mkBlob) return; const id="c"+Date.now().toString(36);
    try{ await idb.put("s-"+id, mkBlob); }catch(e){ return toast(t("alFail")); }
    S.custom.push({id, frame:$("#mkFrame").value, at:Date.now()}); S.stkMeta[id]={title:$("#mkT").value.trim(), story:$("#mkS").value.trim()};
    thumbCache[id]=mkURL; mkURL=""; mkBlob=null; save();
    notify("Andrew added a new sticker to the album", "Andrew agregó una mona nueva al álbum"); toast(t("mkAdded")); render(); };
}

render();

  {sel:'[data-game="scratch"]', duck:"suitcasekid", t:"g_scratch", d:"tw6"},

const TOUR_A = [
  {duck:"doorman", t:"twA1T", d:"twA1"},
  {sel:".tries-box", duck:"bellboy", t:"tw2T", d:"twA2"},
  {sel:'[data-ag="trivia"]', duck:"richwoman", t:"g_trivia", d:"twA3"},
  {sel:'[data-ag="love"]', duck:"avocado", t:"g_love", d:"twA4"},
  {sel:'[data-ag="finish"]', duck:"tiger", t:"g_finish", d:"tw5"},
  {sel:'[data-ag="scratch"]', duck:"pancake", t:"g_scratch", d:"tw6"},
  {sel:'[data-ag="deep"]', duck:"lobbyboy", t:"g_deep", d:"twA7"},
  {sel:'nav.bar [data-tab="wallet"]', duck:"ketchup", t:"tabWallet", d:"twA8"},
  {sel:'nav.bar [data-tab="therapy"]', duck:"rabbit", t:"tabTherapy", d:"tw9"},
  {sel:'nav.bar [data-tab="album"]', duck:"jamtoast", t:"tabAlbum", d:"tw10"},
  {sel:"#bell", duck:"lobbyboy", t:"tw11T", d:"twA11"},
  {sel:"#gear", duck:"concierge", t:"twA12T", d:"twA12", last:true}
];
function startTour(force){
  S.tourSeen ||= {};
  if(document.getElementById("tour")) return;
  const who = isA() ? "andrew" : "her";
  if(!force && S.tourSeen[who]) return;
  if(tab!=="play"){ tab="play"; render(); }
  window.scrollTo(0,0);
  const ov=document.createElement("div"); ov.id="tour"; ov.setAttribute("role","dialog"); ov.setAttribute("aria-modal","true");
  ov.innerHTML=`<div class="tour-hole"></div><div class="tour-card" aria-live="polite"></div>`; document.body.appendChild(ov);
  const hole=ov.querySelector(".tour-hole"), card=ov.querySelector(".tour-card");
  const steps = (who==="andrew"?TOUR_A:TOUR).filter(st=>!st.sel || document.querySelector(st.sel));
  let i=0;
  const end=()=>{ S.tourSeen[who]=true; save(); ov.classList.add("out"); setTimeout(()=>ov.remove(),300); };
  const show=()=>{
    const st=steps[i], el=st.sel && document.querySelector(st.sel);
    if(el){ el.scrollIntoView({block:"center", inline:"center", behavior:"smooth"}); }
    card.classList.remove("in"); card.innerHTML=`<img class="tour-duck" src="${duck(st.duck)}" alt="">
      <h3>${t(st.t)}</h3><p>${t(st.d)}</p>
      <div class="tour-dots" aria-label="${i+1}/${steps.length}">${steps.map((_,k)=>`<i class="${k===i?"on":""}"></i>`).join("")}</div>
      <div class="tour-btns">${st.last?"":`<button type="button" class="tour-skip">${t("twSkip")}</button>`}${i?`<button type="button" class="tour-back">←</button>`:""}<button type="button" class="btn tour-next">${t(st.last?"twGo":i?"next":"twStart")}${st.last?"":" →"}</button></div>`;
    const place=()=>{
      if(!el){ hole.style.cssText="left:50%;top:40%;width:0;height:0"; card.style.top=""; card.style.bottom=""; card.classList.add("center"); card.classList.add("in"); return; }
      card.classList.remove("center");
      const r=el.getBoundingClientRect(), pad=8, vh=innerHeight;
      hole.style.cssText=`left:${r.left-pad}px;top:${r.top-pad}px;width:${r.width+pad*2}px;height:${r.height+pad*2}px`;
      if(r.top+r.height/2 > vh/2){ card.style.bottom=`${Math.max(12, vh-r.top+pad+14)}px`; card.style.top="auto"; }
      else { card.style.top=`${Math.min(vh-260, r.bottom+pad+14)}px`; card.style.bottom="auto"; }
      card.classList.add("in");
    };
    setTimeout(place, el ? 380 : 30);
    card.querySelector(".tour-next").onclick=()=>{ sfx("new"); if(st.last){ confetti(30); return end(); } i++; show(); };
    const bk=card.querySelector(".tour-back"); if(bk) bk.onclick=()=>{ i--; show(); };
    const sk=card.querySelector(".tour-skip"); if(sk) sk.onclick=end;
  };
  addEventListener("resize", ()=>{ if(document.getElementById("tour")) show(); }, {once:true});
  show();
}
function herReminderHTML(){
  if(isA()) return ""; const p=sideProgress(); if(p.done) return "";
  return `<button type="button" class="fill-tile" data-gotab="her"><img class="peek" src="${duck("farmer")}" alt=""><span class="ft-t"><b>${t("remT")}</b><span class="meter"><i style="width:${Math.round(100*p.d/p.n)}%"></i></span></span><span class="mt-n">${p.d}/${p.n}</span><span class="go" aria-hidden="true">→</span></button>`;
}
document.addEventListener("click", e=>{ const g=e.target.closest("[data-gotab]"); if(g){ tab=g.dataset.gotab; render(); window.scrollTo(0,0); } });
function pickDevice(){
  openSheet(`<div class="result"><img class="big sticker" src="${duck("doorman")}" alt=""><h3>${t("devT")}</h3><p class="hint">${t("devD")}</p>
    <div class="row-btns"><button class="btn" type="button" data-dev="her">Indiana</button><button class="btn ghost" type="button" data-dev="andrew">Andrew</button></div></div>`);
  $("#panel [data-close]").remove();
  const set = who => { S.device = who; S.player = who; save(); closeSheet(); setTimeout(()=>startTour(false),300); };
  $('#panel [data-dev="her"]').onclick = () => set("her");
  $('#panel [data-dev="andrew"]').onclick = () => set("andrew");
}
(function waitSplash(n=0){ if(document.getElementById("splash") && n<40) return setTimeout(()=>waitSplash(n+1),300);
  setTimeout(()=>{ if(HOSTED && !S.device) return pickDevice(); startTour(false); },250); })();

/* splash: pink LOADING screen counts to 100%, then the name pops up */
(function(){
  const sp=$("#splash"), title=$("#spBubble");
  let seen=false; try{ seen = sessionStorage.getItem("casita-splash")==="1"; }catch(e){}
  if(seen || matchMedia("(prefers-reduced-motion: reduce)").matches){ sp.remove(); return; }
  $("#spSub").textContent = t("loadSub");
  const word = t("loading"); let n=0, done=false;
  const close=()=>{ if(done) return; done=true; sp.classList.add("out"); setTimeout(()=>sp.remove(),650); try{ sessionStorage.setItem("casita-splash","1"); }catch(e){} };
  const tick=()=>{ n=Math.min(100,n+Math.ceil(Math.random()*9)); title.textContent=`${word} ${n}%`;
    if(n<100) return setTimeout(tick,95);
    setTimeout(()=>{ title.classList.add("name"); title.innerHTML="Casita Huma".split(" ").map((w,wi)=>`<div>${[...w].map((c,i)=>`<span style="animation-delay:${wi*0.18+i*0.04}s">${esc(c)}</span>`).join("")}</div>`).join(""); setTimeout(close,1500); },250); };
  /* our photos AND Duckoos pop in all over the screen while it loads (V67: lots more of them) */
  const DK=["concierge","peach","traveler","bellboy","richwoman","gardener","sunbed","lobbyboy","doorman","rabbit","pig","farmer","founder","suitcasekid","tiger","ketchup","pancake","avocado","lemonade","mushroom","caveman","apron","jamtoast","scarecrow","orange","potato"].sort(()=>Math.random()-.5).slice(0,16);
  const pics=[...[...Array(CUTS)].map((_,i)=>({src:`people/p${i+1}.webp`, w:[30,40]})), ...DK.map(d=>({src:duck(d), w:[16,22], dk:true}))].sort(()=>Math.random()-.5);
  const cols=4, rowsN=Math.ceil(pics.length/cols), spots=[];
  for(let r=0;r<rowsN;r++) for(let c=0;c<cols;c++) spots.push([c*25-6+(r%2?8:0), r*(96/rowsN)-4]);
  spots.sort(()=>Math.random()-.5);
  pics.forEach((p,i)=>setTimeout(()=>{ if(done) return; const im=new Image(); im.src=p.src; im.alt=""; im.className="sp-pic"+(p.dk?" sp-duck":"");
    const [x,y]=spots[i]; im.style.left=(x+Math.random()*8-4)+"%"; im.style.top=(y+Math.random()*6-3)+"%";
    im.style.setProperty("--r",(Math.random()*36-18).toFixed(1)+"deg"); im.style.width=(p.w[0]+Math.random()*(p.w[1]-p.w[0])).toFixed(0)+"vw";
    sp.insertBefore(im, sp.firstChild); }, 80+i*85));
  tick(); sp.addEventListener("click", close);
})();

document.addEventListener("click", e=>{ if(e.target.closest(".streak")) toast(t("stRule")); });
/* little confetti burst on every button tap */
document.addEventListener("pointerdown", e=>{
  const b = e.target.closest("button"); if(!b || b.disabled || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cols=["#d14735","#efe84c","#bcdaf7","#ecc3c9","#4a2a1a"];
  for(let i=0;i<7;i++){ const d=document.createElement("span"); const ang=Math.random()*Math.PI*2, r=28+Math.random()*26;
    d.className="burst"+(i%3===0?" h":""); if(i%3===0){ d.textContent="♥"; d.style.color=cols[i%4]; } else d.style.background=cols[i%cols.length];
    d.style.left=e.clientX+"px"; d.style.top=e.clientY+"px"; d.style.setProperty("--dx",Math.cos(ang)*r+"px"); d.style.setProperty("--dy",Math.sin(ang)*r+"px");
    document.body.appendChild(d); setTimeout(()=>d.remove(),650); }
}, {passive:true});
})();
